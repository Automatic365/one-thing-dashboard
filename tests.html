<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Thing Dashboard - Logic Tests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ==========================================
        // LOGIC TO TEST (Copied/Adapted from index.html)
        // ==========================================

        const createEmptyGoals = () => ({
            someday: { text: '', updatedAt: null },
            fiveYear: { text: '', updatedAt: null },
            annualGoals: [{},{},{},{},{}],
            monthlyGoals: [{},{},{},{},{}],
            weeklyGoals: [{},{},{},{},{}],
            daily: { text: '', updatedAt: null }
        });

        const LIFE_AREAS = {
            business: { name: 'Business' } // Simplified for testing
        };

        const getInitialState = () => ({
            version: 6,
            lifeAreas: {
                business: {
                    active: false,
                    goals: createEmptyGoals(),
                    completions: [],
                    reviews: {
                        monthly: [],
                        quarterly: []
                    }
                }
            }
        });

        // The Migration Logic
        const migrateData = (oldData) => {
            // If already version 6, no migration needed
            if (oldData.version === 6) return oldData;

            // Version 5 → 6: Add quarterly reviews array
            if (oldData.version === 5) {
                const newData = { ...oldData, version: 6 };
                Object.keys(newData.lifeAreas).forEach(areaKey => {
                    if (!newData.lifeAreas[areaKey].reviews) {
                        newData.lifeAreas[areaKey].reviews = { monthly: [], quarterly: [] };
                    } else if (!newData.lifeAreas[areaKey].reviews.quarterly) {
                        newData.lifeAreas[areaKey].reviews.quarterly = [];
                    }
                });
                return newData;
            }
            return oldData; // simplified for test
        };

        // Quarter String Logic
        const getCurrentQuarterString = (date = new Date()) => {
            const year = date.getFullYear();
            const quarter = Math.floor(date.getMonth() / 3) + 1;
            return `${year}-Q${quarter}`;
        };

        // Save Logic Simulation
        const simulateSaveQuarterly = (currentState, areaKey, reviewData) => {
            // Mock Date for consistency
            const currentQuarter = "2026-Q1"; 
            
            const area = currentState.lifeAreas[areaKey];
            const existingReviews = area.reviews.quarterly || [];
            const existingIndex = existingReviews.findIndex(r => r.date === currentQuarter);

            let updatedReviews;
            if (existingIndex >= 0) {
                updatedReviews = [...existingReviews];
                updatedReviews[existingIndex] = { date: currentQuarter, ...reviewData };
            } else {
                updatedReviews = [...existingReviews, { date: currentQuarter, ...reviewData }];
            }

            return {
                ...currentState,
                lifeAreas: {
                    ...currentState.lifeAreas,
                    [areaKey]: {
                        ...area,
                        reviews: {
                            ...area.reviews,
                            quarterly: updatedReviews
                        }
                    }
                }
            };
        };

        // ==========================================
        // TEST RUNNER
        // ==========================================
        const results = [];

        function test(name, fn) {
            try {
                fn();
                results.push({ name, status: 'PASS' });
            } catch (e) {
                results.push({ name, status: 'FAIL', error: e.message });
                console.error(e);
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message || "Assertion failed");
        }
        
        function assertEqual(actual, expected, message) {
            if (actual !== expected) {
                throw new Error(`${message}: Expected '${expected}', got '${actual}'`);
            }
        }

        function runTests() {
            // TEST 1: Migration v5 to v6
            test("Migration: v5 adds quarterly array", () => {
                const v5Data = {
                    version: 5,
                    lifeAreas: {
                        business: {
                            reviews: { monthly: [] }
                        }
                    }
                };
                const v6Data = migrateData(v5Data);
                assert(v6Data.version === 6, "Version should be 6");
                assert(Array.isArray(v6Data.lifeAreas.business.reviews.quarterly), "Quarterly array should exist");
            });

            // TEST 2: Current Quarter String
            test("Helper: getCurrentQuarterString", () => {
                // Use safe local dates: year, month index (0-11), day
                const d1 = new Date(2026, 0, 15); // Jan 15
                assertEqual(getCurrentQuarterString(d1), '2026-Q1', "Jan should be Q1");
                
                const d2 = new Date(2026, 3, 1); // Apr 1
                assertEqual(getCurrentQuarterString(d2), '2026-Q2', "Apr should be Q2");

                const d3 = new Date(2026, 9, 31); // Oct 31
                assertEqual(getCurrentQuarterString(d3), '2026-Q4', "Oct should be Q4");
            });

            // TEST 3: Saving a new review
            test("Logic: Save new quarterly review", () => {
                const state = getInitialState();
                const reviewData = { q1: "test answer" };
                const newState = simulateSaveQuarterly(state, 'business', reviewData);
                
                assert(newState.lifeAreas.business.reviews.quarterly.length === 1, "Should add 1 review");
                assert(newState.lifeAreas.business.reviews.quarterly[0].q1 === "test answer", "Should save data");
                assert(newState.lifeAreas.business.reviews.quarterly[0].date === "2026-Q1", "Should set correct date");
            });

            // TEST 4: Updating an existing review
            test("Logic: Update existing quarterly review", () => {
                let state = getInitialState();
                // Add initial review
                state.lifeAreas.business.reviews.quarterly.push({
                    date: "2026-Q1",
                    q1: "initial"
                });

                const updateData = { q1: "updated" };
                const newState = simulateSaveQuarterly(state, 'business', updateData);

                assert(newState.lifeAreas.business.reviews.quarterly.length === 1, "Should still be 1 review");
                assert(newState.lifeAreas.business.reviews.quarterly[0].q1 === "updated", "Should update text");
            });

            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('results');
            let html = '';
            results.forEach(r => {
                const color = r.status === 'PASS' ? 'text-green-400' : 'text-red-400';
                const icon = r.status === 'PASS' ? '✓' : '✗';
                html += `<div class="p-3 bg-slate-800 rounded-lg border border-slate-700 mb-2 flex justify-between items-center">
                    <span class="text-white font-mono">${r.name}</span>
                    <span class="${color} font-bold">${icon} ${r.status}</span>
                </div>`;
                if (r.error) {
                    html += `<div class="ml-4 mb-4 text-sm text-red-300 font-mono">${r.error}</div>`;
                }
            });
            container.innerHTML = html;
        }

        window.onload = runTests;
    </script>
</head>
<body class="bg-slate-900 text-slate-200 p-10 font-sans">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-white border-b border-slate-700 pb-4">
            Test Results
        </h1>
        <div id="results"></div>
    </div>
</body>
</html>
