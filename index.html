<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The ONE Thing - Focus on What Matters Most</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                            950: '#020617',
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(124, 58, 237, 0.3)',
                        'glow-cyan': '0 0 15px rgba(6, 182, 212, 0.3)',
                        'glow-teal': '0 0 15px rgba(13, 148, 136, 0.3)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)'
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            /* Neon Palette */
            --neon-cyan: #06b6d4;
            --neon-magenta: #d946ef;
            --neon-green: #10b981;
            --neon-blue: #3b82f6;
            --deep-space: #030712;
            --grid-color: rgba(6, 182, 212, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--deep-space);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Headings Font */
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-display {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.05em;
        }

        .font-tech {
            font-family: 'Rajdhani', sans-serif;
        }

        /* Moving Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
        }

        .grid-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 0;
            border: 1px solid #06b6d4;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* High-Tech Glass */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.1);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* HUD Corner Borders */
        .hud-card {
            position: relative;
        }

        .hud-card::before,
        .hud-card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        .hud-card::before {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }

        .hud-card::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }

        .hud-card:hover::before,
        .hud-card:hover::after {
            width: 100%;
            height: 100%;
            opacity: 1;
            box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.1);
        }

        /* Neon Glows */
        .glass-hover:hover {
            background: rgba(6, 182, 212, 0.05);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }

        /* Glitch Effect */
        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: var(--neon-cyan);
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }

        /* Domino Styles */
        .domino-chain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .domino {
            width: 60px;
            height: 100px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(6, 182, 212, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.1);
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }

        .domino.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--neon-green);
            transform: translateY(5px);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .domino.active {
            background: rgba(6, 182, 212, 0.1);
            border-color: var(--neon-cyan);
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.6);
            z-index: 10;
        }

        .domino-dot {
            width: 6px;
            height: 6px;
            background: #475569;
            border-radius: 0;
            /* Square dots for tech look */
            transition: all 0.3s ease;
        }

        .domino.completed .domino-dot,
        .domino.active .domino-dot {
            background: #fff;
            box-shadow: 0 0 8px #fff;
        }

        .arrow {
            font-size: 24px;
            color: #334155;
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
        }

        .domino:hover+.arrow,
        .domino.active+.arrow {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            transform: translateX(5px);
        }

        .time-block {
            min-height: 70px;
            border: 1px dashed rgba(6, 182, 212, 0.3);
            background: rgba(15, 23, 42, 0.3);
            transition: all 0.2s ease;
            position: relative;
        }

        .time-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: transparent;
            transition: background 0.3s;
        }

        .time-block:hover {
            border-color: var(--neon-cyan);
            background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }

        .time-block:hover::before {
            background: var(--neon-cyan);
        }

        .time-block.filled {
            border-style: solid;
            border-color: var(--neon-cyan);
            background: rgba(6, 182, 212, 0.1);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Scanline Animation */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(6, 182, 212, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% {
                bottom: 100%;
            }

            80% {
                bottom: 100%;
            }

            100% {
                bottom: -100%;
            }
        }

        /* Gradient Text */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #06b6d4, #d946ef);
            filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.5));
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(6, 182, 212, 0.1);
            border-left-color: var(--neon-cyan);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>

<body class="antialiased selection:bg-cyan-500 selection:text-black">
    <div class="grid-bg"></div>
    <div class="grid-glow"></div>
    <div id="root"></div>

    <script type="module">
        import { LIFE_AREAS, createEmptyGoals, getInitialState, migrateData } from './migrateData.mjs';

        window.AppData = { LIFE_AREAS, createEmptyGoals, getInitialState, migrateData };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        const { LIFE_AREAS, createEmptyGoals, getInitialState, migrateData } = window.AppData;

        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================
        // IMPORTANT: Replace this with your Firebase config
        // Get this from: Firebase Console > Project Settings > Your apps > Config
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBao1vJH9q3Z11x-XXzgGbtGAMS-5h6t2Q",
            authDomain: "one-thing-dashboard.firebaseapp.com",
            projectId: "one-thing-dashboard",
            storageBucket: "one-thing-dashboard.firebasestorage.app",
            messagingSenderId: "574870247678",
            appId: "1:574870247678:web:7f48eb160d11cd5444edaf"
        };

        // Check if Firebase is configured
        const isFirebaseConfigured = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY_HERE";

        // Initialize Firebase only if configured
        let db = null;
        let auth = null;

        if (isFirebaseConfigured) {
            try {
                firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.firestore();
                auth = firebase.auth();
            } catch (error) {
                console.error("Firebase initialization error:", error);
            }
        }

        // ==========================================
        // QUOTES
        // ==========================================
        const QUOTES = [
            "What's the ONE Thing I can do such that by doing it everything else will be easier or unnecessary?",
            "You can do two things at once, but you can't focus effectively on two things at once.",
            "Success is built sequentially. It's one thing at a time.",
            "Extraordinary results come from focusing on your ONE Thing.",
            "When you strive for greatness, chaos is guaranteed to show up.",
            "Multitasking is merely the opportunity to screw up more than one thing at a time.",
            "The key is over time. Success is built sequentially. It's one thing at a time.",
            "Achievers always work from a clear sense of priority.",
            "Until my ONE Thing is done—everything else is a distraction.",
            "What matters most is always a priority.",
            "Purpose without priority is powerless.",
            "When you know what matters most, everything makes sense.",
            "Most people struggle with life balance simply because they haven't paid the price to decide what is really important to them.",
            "You need to be doing fewer things for more effect instead of doing more things with side effects.",
            "Think big, go small, get extraordinary results."
        ];

        // ==========================================
        // DATA LAYER
        // ==========================================

        // LocalStorage fallback
        const loadFromLocalStorage = () => {
            const saved = localStorage.getItem('oneThingApp');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    return migrateData(parsed);
                } catch (e) {
                    console.error('Error parsing saved data:', e);
                }
            }
            return getInitialState();
        };

        const saveToLocalStorage = (state) => {
            localStorage.setItem('oneThingApp', JSON.stringify(state));
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [state, setState] = useState(getInitialState);
            const [currentView, setCurrentView] = useState('dashboard');
            const [syncing, setSyncing] = useState(false);
            const [selectedLifeArea, setSelectedLifeArea] = useState('business'); // Default to business

            // Auth state listener
            useEffect(() => {
                if (!isFirebaseConfigured || !auth) {
                    setLoading(false);
                    setState(loadFromLocalStorage());
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setUser(user);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            // Firestore sync
            useEffect(() => {
                if (!user || !db) {
                    // Use localStorage when offline or not authenticated
                    if (!isFirebaseConfigured) {
                        setState(loadFromLocalStorage());
                    }
                    return;
                }

                setSyncing(true);
                const docRef = db.collection('users').doc(user.uid);

                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const originalData = doc.data();
                        const data = migrateData(originalData);
                        setState(data);
                        // If migration happened (version changed), save migrated data back
                        if (data.version !== originalData.version) {
                            docRef.set(data);
                        }
                    } else {
                        // First time user - migrate from localStorage
                        const localData = loadFromLocalStorage();
                        docRef.set(localData).then(() => {
                            setState(localData);
                        });
                    }
                    setSyncing(false);
                }, (error) => {
                    console.error("Firestore sync error:", error);
                    setSyncing(false);
                });

                return () => unsubscribe();
            }, [user]);

            // Save to Firestore or localStorage
            const saveState = useCallback((newState) => {
                setState(newState);

                if (user && db) {
                    db.collection('users').doc(user.uid).set(newState);
                } else {
                    saveToLocalStorage(newState);
                }
            }, [user]);

            // Toggle life area active state
            const toggleLifeArea = (areaKey) => {
                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            active: !state.lifeAreas[areaKey].active
                        }
                    }
                };
                saveState(newState);
            };

            // Update goal for a specific life area
            const updateGoal = (areaKey, level, text) => {
                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...state.lifeAreas[areaKey].goals,
                                [level]: { text, updatedAt: new Date().toISOString() }
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Update annual goal at specific index
            const updateAnnualGoal = (areaKey, index, text) => {
                const goals = state.lifeAreas[areaKey].goals;
                const updatedAnnualGoals = [...goals.annualGoals];
                updatedAnnualGoals[index] = { text, updatedAt: new Date().toISOString() };

                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...goals,
                                annualGoals: updatedAnnualGoals
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Set which of the 5 annual goals is THE annual ONE Thing
            const setAnnualOneThing = (areaKey, index) => {
                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...state.lifeAreas[areaKey].goals,
                                annualOneThingIndex: index
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Update monthly goal at specific index
            const updateMonthlyGoal = (areaKey, index, text) => {
                const goals = state.lifeAreas[areaKey].goals;
                const updatedMonthlyGoals = [...goals.monthlyGoals];
                updatedMonthlyGoals[index] = { text, updatedAt: new Date().toISOString() };

                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...goals,
                                monthlyGoals: updatedMonthlyGoals
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Set which of the 5 monthly goals is THE monthly ONE Thing
            const setMonthlyOneThing = (areaKey, index) => {
                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...state.lifeAreas[areaKey].goals,
                                monthlyOneThingIndex: index
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Update weekly goal at specific index
            const updateWeeklyGoal = (areaKey, index, text) => {
                const goals = state.lifeAreas[areaKey].goals;
                const updatedWeeklyGoals = [...goals.weeklyGoals];
                updatedWeeklyGoals[index] = { text, updatedAt: new Date().toISOString() };

                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...goals,
                                weeklyGoals: updatedWeeklyGoals
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Set which of the 5 weekly goals is THE weekly ONE Thing
            const setWeeklyOneThing = (areaKey, index) => {
                const newState = {
                    ...state,
                    lifeAreas: {
                        ...state.lifeAreas,
                        [areaKey]: {
                            ...state.lifeAreas[areaKey],
                            goals: {
                                ...state.lifeAreas[areaKey].goals,
                                weeklyOneThingIndex: index
                            }
                        }
                    }
                };
                saveState(newState);
            };

            // Add time block
            const addTimeBlock = (block) => {
                const newState = {
                    ...state,
                    timeBlocks: [...state.timeBlocks, { ...block, id: Date.now() }]
                };
                saveState(newState);
            };

            // Update time block
            const updateTimeBlock = (id, updates) => {
                const newState = {
                    ...state,
                    timeBlocks: state.timeBlocks.map(block =>
                        block.id === id ? { ...block, ...updates } : block
                    )
                };
                saveState(newState);
            };

            // Delete time block
            const deleteTimeBlock = (id) => {
                const newState = {
                    ...state,
                    timeBlocks: state.timeBlocks.filter(block => block.id !== id)
                };
                saveState(newState);
            };

            // Mark daily goal as complete for a specific life area
            // Helper to get local date string YYYY-MM-DD
            const getLocalDateString = () => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const completeDaily = (areaKey) => {
                const today = getLocalDateString();
                const area = state.lifeAreas[areaKey];
                const alreadyCompleted = area.completions.some(c => c.date === today);

                if (alreadyCompleted) {
                    // Remove completion
                    const newState = {
                        ...state,
                        lifeAreas: {
                            ...state.lifeAreas,
                            [areaKey]: {
                                ...area,
                                ...state.lifeAreas[areaKey], // Sustain other props
                                completions: area.completions.filter(c => c.date !== today)
                            }
                        }
                    };
                    saveState(newState);
                } else if (area.goals.daily.text) {
                    // Add completion
                    const newState = {
                        ...state,
                        lifeAreas: {
                            ...state.lifeAreas,
                            [areaKey]: {
                                ...area,
                                ...state.lifeAreas[areaKey],
                                completions: [...area.completions, {
                                    date: today,
                                    goal: area.goals.daily.text
                                }]
                            }
                        }
                    };
                    saveState(newState);
                }
            };

            // Mark weekly review as complete (4-1-1 system)
            const markWeeklyReview = () => {
                const today = getLocalDateString();
                const newState = {
                    ...state,
                    lastWeeklyReview: today
                };
                saveState(newState);
            };

            // Mark annual review as complete (4-1-1 system)
            const markAnnualReview = () => {
                const today = getLocalDateString();
                const newState = {
                    ...state,
                    lastAnnualReview: today
                };
                saveState(newState);
            };

            // Export data
            const exportData = () => {
                const dataStr = JSON.stringify(state, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `one-thing-backup-${getLocalDateString()}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            // Import data
            const importData = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        saveState(imported);
                        alert('Data imported successfully!');
                    } catch (err) {
                        alert('Error importing data. Please check the file format.');
                    }
                };
                reader.readAsText(file);
            };

            // Rotate quote
            const rotateQuote = () => {
                const newState = {
                    ...state,
                    currentQuoteIndex: (state.currentQuoteIndex + 1) % QUOTES.length
                };
                saveState(newState);
            };

            // Logout
            const handleLogout = () => {
                if (auth) {
                    auth.signOut();
                }
            };

        // ==========================================
        // AUTH SCREEN
        // ==========================================
        function AuthScreen() {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (mode === 'login') {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGoogleSignIn = async () => {
                setError('');
                setLoading(true);

                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
                    {/* Background Blobs */}
                    <div className="absolute top-0 left-0 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow"></div>
                    <div className="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow animation-delay-2000"></div>

                    <div className="max-w-md w-full glass rounded-2xl p-8 relative z-10 animate-float">
                        <div className="text-center mb-10">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 shadow-glow">
                                <span className="text-4xl font-bold text-white">1</span>
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">The ONE Thing</h1>
                            <p className="text-slate-400">Focus on what matters most</p>
                        </div>

                        {/* Google Sign-In Button */}
                        <button
                            onClick={handleGoogleSignIn}
                            disabled={loading}
                            className="w-full bg-white text-gray-800 py-3 rounded-xl font-semibold hover:bg-gray-100 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 flex items-center justify-center space-x-3 mb-6 shadow-lg"
                        >
                            <svg className="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            <span>{loading ? 'Connecting...' : 'Continue with Google'}</span>
                        </button>

                        <div className="relative my-8">
                            <div className="absolute inset-0 flex items-center">
                                <div className="w-full border-t border-slate-700"></div>
                            </div>
                            <div className="relative flex justify-center text-sm">
                                <span className="px-4 bg-slate-800 text-slate-400 rounded-full">Or continue with email</span>
                            </div>
                        </div>

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2 ml-1">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-600 transition-all"
                                    placeholder="you@example.com"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2 ml-1">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    minLength="6"
                                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-600 transition-all"
                                    placeholder="••••••••"
                                />
                            </div>

                            {error && (
                                <div className="bg-red-500/10 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl text-sm flex items-center">
                                    <span className="mr-2">⚠️</span> {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-xl font-bold hover:shadow-glow transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
                            >
                                {loading ? 'Processing...' : mode === 'login' ? 'Log In' : 'Sign Up'}
                            </button>
                        </form>

                        <div className="mt-8 text-center">
                            <button
                                onClick={() => setMode(mode === 'login' ? 'signup' : 'login')}
                                className="text-indigo-400 hover:text-indigo-300 text-sm font-medium transition-colors"
                            >
                                {mode === 'login' ? "Don't have an account? Sign Up" : 'Already have an account? Log In'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: '🎯' },

                                        Syncing

                            </div>

                            <div className="flex items-center space-x-1">
                                {navItems.map(item => {
                                    const isActive = currentView === item.id;
                                    return (
                                        <button
                                            key={item.id}

                                            className={`px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 ${isActive
                                                ? 'bg-slate-800 text-white shadow-lg border border-slate-700'

                                    >
                                        Logout
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </nav>
            );
        }

                                <div className="flex-1">

                                Begin Your Journey

            const getLocalDateString = () => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const [selectedDate, setSelectedDate] = useState(getLocalDateString());
            const [newBlock, setNewBlock] = useState({
                startTime: '09:00',
                duration: 4,
                task: '',
                lifeArea: activeAreas[0] || 'business'
            });

            const handleAddBlock = () => {
                if (!newBlock.task) {
                    alert('Please enter a task for this time block');
                    return;
                }

                // Create correct start/end times preserving the selected date
                // Append T to ensure it is treated as local iso time
                const start = new Date(`${selectedDate}T${newBlock.startTime}`);
                const end = new Date(start.getTime() + newBlock.duration * 60 * 60 * 1000);

                addTimeBlock({
                    date: selectedDate,
                    startTime: newBlock.startTime,
                    endTime: end.toTimeString().slice(0, 5),
                    task: newBlock.task,
                    lifeArea: newBlock.lifeArea,
                    completed: false
                });

                setNewBlock({ startTime: '09:00', duration: 4, task: '', lifeArea: newBlock.lifeArea });
            };

            const todayBlocks = timeBlocks.filter(block => block.date === selectedDate);

            // Helper to parsing YYYY-MM-DD as local date for display
            const formatDisplayDate = (dateStr) => {
                const [y, m, d] = dateStr.split('-').map(Number);
                const date = new Date(y, m - 1, d); // Month is 0-indexed
                return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            };

            return (
                <div className="space-y-8 fade-in text-white">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-600/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">⏰</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Time Blocking</h2>
                        <p className="text-slate-400 text-lg">
                            Dedicate uninterrupted time blocks to your ONE Thing
                        </p>
                    </div>

                    <div className="glass rounded-2xl p-6 border border-blue-500/30 bg-blue-500/5">
                        <h3 className="font-bold text-blue-300 mb-2 flex items-center">
                            <span className="mr-2">⚡️</span> The Power of Time Blocking
                        </h3>
                        <p className="text-blue-100/80 text-sm leading-relaxed">
                            Protect time for your ONE Thing by blocking off dedicated chunks. The recommended duration is 4 hours -
                            this ensures you have the uninterrupted focus needed for extraordinary results.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="md:col-span-1 space-y-6">
                            <div className="glass rounded-2xl p-6 border border-slate-700/50">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">
                                    Select Date
                                </label>
                                <input
                                    type="date"
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-900/60 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white transition-all text-sm"
                                />
                            </div>

                            <div className="glass rounded-2xl p-6 border border-slate-700/50">
                                <h3 className="text-lg font-bold text-white mb-5 flex items-center">
                                    <span className="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center mr-3 text-indigo-400">+</span>
                                    Add Block
                                </h3>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                            Life Area
                                        </label>
                                        <select
                                            value={newBlock.lifeArea}
                                            onChange={(e) => setNewBlock({ ...newBlock, lifeArea: e.target.value })}
                                            className="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm"
                                        >
                                            {activeAreas.map(areaKey => (
                                                <option key={areaKey} value={areaKey}>
                                                    {LIFE_AREAS[areaKey].icon} {LIFE_AREAS[areaKey].name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                                Start
                                            </label>
                                            <input
                                                type="time"
                                                value={newBlock.startTime}
                                                onChange={(e) => setNewBlock({ ...newBlock, startTime: e.target.value })}
                                                className="w-full px-3 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                                Hours
                                            </label>
                                            <select
                                                value={newBlock.duration}
                                                onChange={(e) => setNewBlock({ ...newBlock, duration: Number(e.target.value) })}
                                                className="w-full px-3 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm"
                                            >
                                                {[1, 2, 3, 4, 5, 6, 7, 8].map(h => (
                                                    <option key={h} value={h}>{h} hr{h > 1 ? 's' : ''}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                            Task (The ONE Thing)
                                        </label>
                                        <input
                                            type="text"
                                            value={newBlock.task}
                                            onChange={(e) => setNewBlock({ ...newBlock, task: e.target.value })}
                                            placeholder="What will you focus on?"
                                            className="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm placeholder-slate-500"
                                        />
                                    </div>

                                    {activeAreas.length > 0 && (
                                        <div className="pt-2">
                                            <span className="text-xs text-slate-500 mb-2 block ml-1">Quick fill from goals:</span>
                                            <div className="flex flex-wrap gap-2">
                                                {activeAreas.map(areaKey => {
                                                    const dailyGoal = lifeAreas[areaKey].goals.daily.text;
                                                    if (dailyGoal) {
                                                        return (
                                                            <button
                                                                key={areaKey}
                                                                onClick={() => setNewBlock({ ...newBlock, task: dailyGoal, lifeArea: areaKey })}
                                                                className="text-xs px-2 py-1 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded text-slate-300 truncate max-w-full transition-colors flex items-center"
                                                                title={dailyGoal}
                                                            >
                                                                <span className="mr-1">{LIFE_AREAS[areaKey].icon}</span>
                                                                {dailyGoal.substring(0, 15)}{dailyGoal.length > 15 ? '...' : ''}
                                                            </button>
                                                        );
                                                    }
                                                    return null;
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <button
                                        onClick={handleAddBlock}
                                        className="w-full px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-indigo-500/30 mt-2"
                                    >
                                        Schedule Block
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="md:col-span-2">
                            <div className="glass rounded-2xl p-6 border border-slate-700/50 min-h-[500px]">
                                <h3 className="text-xl font-bold text-white mb-6 flex items-center justify-between">
                                    <span>Schedule &nbsp;<span className="text-slate-500 font-normal text-base">
                                        {formatDisplayDate(selectedDate)}
                                    </span></span>
                                    {todayBlocks.length > 0 && <span className="text-xs font-normal px-2 py-1 bg-slate-800 rounded-lg text-slate-400">{todayBlocks.length} blocks</span>}
                                </h3>

                                {todayBlocks.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-64 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
                                        <span className="text-4xl mb-3 opacity-50">📅</span>
                                        <p className="text-center">No time blocks scheduled for this day.</p>
                                        <p className="text-sm opacity-60">"If it's not on your calendar, it doesn't exist."</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {todayBlocks.sort((a, b) => a.startTime.localeCompare(b.startTime)).map(block => {
                                            const areaInfo = LIFE_AREAS[block.lifeArea] || LIFE_AREAS.business;
                                            return (
                                                <div
                                                    key={block.id}
                                                    className={`time-block p-5 rounded-xl border transition-all duration-300 group ${block.completed
                                                        ? 'bg-slate-900/40 border-slate-800 opacity-60'
                                                        : 'glass hover:bg-white/5 border-slate-600/50 hover:border-slate-500 hover:shadow-lg hover:shadow-indigo-500/10'
                                                        }`}
                                                >
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex-1">
                                                            <div className="flex items-start space-x-4">
                                                                <div className="mt-1">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={block.completed}
                                                                        onChange={(e) => updateTimeBlock(block.id, { completed: e.target.checked })}
                                                                        className="w-6 h-6 text-emerald-500 rounded-md focus:ring-emerald-500 focus:ring-offset-slate-900 bg-slate-700 border-slate-500 cursor-pointer transition-all"
                                                                    />
                                                                </div>
                                                                <div className="flex-1">
                                                                    <div className="flex items-center gap-2 mb-1">
                                                                        <span className="text-sm px-2 py-0.5 bg-slate-800/80 text-slate-300 rounded text-xs font-mono border border-slate-700">
                                                                            {block.startTime} - {block.endTime}
                                                                        </span>
                                                                        <span className={`text-xs px-2 py-0.5 rounded-full flex items-center gap-1 border border-slate-700 bg-${areaInfo.color}-500/10 text-${areaInfo.color}-300`}>
                                                                            {areaInfo.icon} {areaInfo.name}
                                                                        </span>
                                                                    </div>
                                                                    <p className={`text-lg font-medium transition-all ${block.completed ? 'line-through text-slate-500' : 'text-white'}`}>
                                                                        {block.task}
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button
                                                            onClick={() => deleteTimeBlock(block.id)}
                                                            className="text-slate-600 hover:text-red-400 p-2 rounded-lg hover:bg-red-500/10 transition-colors opacity-0 group-hover:opacity-100"
                                                            title="Delete Block"
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // PROGRESS TRACKER
        // ==========================================
        function ProgressTracker({ lifeAreas, activeAreas }) {
            // Helper to get local date string YYYY-MM-DD
            const getLocalDateString = (dateObj = new Date()) => {
                const offset = dateObj.getTimezoneOffset() * 60000;
                return new Date(dateObj.getTime() - offset).toISOString().split('T')[0];
            };

            // Aggregate completions from all active life areas
            const allCompletions = [];
            Object.keys(lifeAreas).forEach(areaKey => {
                if (lifeAreas[areaKey].active) {
                    lifeAreas[areaKey].completions.forEach(comp => {
                        allCompletions.push({
                            ...comp,
                            lifeArea: areaKey
                        });
                    });
                }
            });

            // Use local date for 'today'
            const todayStr = getLocalDateString();

            const last30Days = Array.from({ length: 30 }, (_, i) => {
                const date = new Date();
                date.setDate(date.getDate() - (29 - i));
                return getLocalDateString(date);
            });

            const completionMap = allCompletions.reduce((acc, comp) => {
                acc[comp.date] = true;
                return acc;
            }, {});

            const completedDays = last30Days.filter(date => completionMap[date]).length;
            const completionRate = Math.round((completedDays / 30) * 100);

            let currentStreak = 0;
            for (let i = 0; i < 30; i++) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = getLocalDateString(date);
                if (completionMap[dateStr]) {
                    currentStreak++;
                } else {
                    break;
                }
            }

            return (
                <div className="space-y-8 fade-in text-white">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-green-500/20 to-emerald-600/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">📈</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Progress & Statistics</h2>
                        <p className="text-slate-400 text-lg">
                            Track your consistency and celebrate your wins
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass rounded-2xl p-6 border border-blue-500/30 bg-blue-500/5 text-center group hover:bg-blue-500/10 transition-colors">
                            <div className="text-5xl font-bold text-blue-400 mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(96,165,250,0.5)]">
                                {currentStreak}
                            </div>
                            <div className="text-blue-200 font-bold uppercase tracking-wider text-sm">Day Streak</div>
                            <div className="text-blue-300/60 text-xs mt-1">Current consecutive days</div>
                        </div>

                        <div className="glass rounded-2xl p-6 border border-emerald-500/30 bg-emerald-500/5 text-center group hover:bg-emerald-500/10 transition-colors">
                            <div className="text-5xl font-bold text-emerald-400 mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(52,211,153,0.5)]">
                                {completedDays}
                            </div>
                            <div className="text-emerald-200 font-bold uppercase tracking-wider text-sm">Completed Days</div>
                            <div className="text-emerald-300/60 text-xs mt-1">Last 30 days</div>
                        </div>

                        <div className="glass rounded-2xl p-6 border border-purple-500/30 bg-purple-500/5 text-center group hover:bg-purple-500/10 transition-colors">
                            <div className="text-5xl font-bold text-purple-400 mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(167,139,250,0.5)]">
                                {completionRate}%
                            </div>
                            <div className="text-purple-200 font-bold uppercase tracking-wider text-sm">Completion Rate</div>
                            <div className="text-purple-300/60 text-xs mt-1">Last 30 days</div>
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center">
                            Last 30 Days
                        </h3>
                        <div className="grid grid-cols-10 gap-3">
                            {last30Days.map((date, i) => {
                                const isCompleted = completionMap[date];
                                const [y, m, d] = date.split('-').map(Number);
                                const dateObj = new Date(y, m - 1, d);
                                const isToday = date === todayStr;

                                return (
                                    <div
                                        key={date}
                                        className={`aspect-square rounded-lg flex flex-col items-center justify-center text-xs transition-all duration-300 relative group cursor-default ${isCompleted
                                            ? 'bg-emerald-500 text-white shadow-[0_0_10px_rgba(16,185,129,0.5)] scale-105 z-10'
                                            : isToday
                                                ? 'bg-slate-800 border-2 border-indigo-500 text-indigo-400 shadow-[0_0_10px_rgba(99,102,241,0.3)]'
                                                : 'bg-slate-800/50 text-slate-600 hover:bg-slate-800 hover:text-slate-400'
                                            }`}
                                        title={dateObj.toLocaleDateString()}
                                        style={{ transitionDelay: `${i * 10}ms` }}
                                    >
                                        <div className="font-bold">{dateObj.getDate()}</div>
                                        {isCompleted && (
                                            <div className="absolute inset-0 bg-emerald-400 rounded-lg blur opacity-20"></div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50 min-h-[400px]">
                        <h3 className="text-xl font-bold text-white mb-6">Recent Completions</h3>
                        {allCompletions.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-64 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
                                <span className="text-4xl mb-3 opacity-50">🏆</span>
                                <p className="text-center">No completions yet.</p>
                                <p className="text-sm opacity-60">Start by setting and completing your daily ONE Thing!</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {allCompletions
                                    .slice()
                                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                                    .slice(0, 10)
                                    .map((completion, index) => {
                                        const areaInfo = LIFE_AREAS[completion.lifeArea];
                                        const [y, m, d] = completion.date.split('-').map(Number);
                                        const dateObj = new Date(y, m - 1, d);
                                        return (
                                            <div
                                                key={index}
                                                className="flex items-center space-x-4 p-4 rounded-xl border border-slate-700/50 bg-slate-800/30 hover:bg-slate-800/50 transition-all hover:scale-[1.01] group"
                                            >
                                                <div className="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500 border border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.1)] group-hover:shadow-[0_0_15px_rgba(16,185,129,0.2)] transition-all">
                                                    ✓
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-lg filter drop-shadow">{areaInfo.icon}</span>
                                                        <span className={`text-xs px-2 py-0.5 rounded-full border border-slate-700 bg-${areaInfo.color}-500/10 text-${areaInfo.color}-300 font-mono uppercase tracking-wide`}>
                                                            {areaInfo.name}
                                                        </span>
                                                    </div>
                                                    <p className="font-medium text-white group-hover:text-indigo-200 transition-colors">{completion.goal}</p>
                                                    <p className="text-xs text-slate-500 mt-1">
                                                        {dateObj.toLocaleDateString('en-US', {
                                                            weekday: 'long',
                                                            year: 'numeric',
                                                            month: 'long',
                                                            day: 'numeric'
                                                        })}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // SETTINGS
        // ==========================================
        function Settings({ exportData, importData, user }) {
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (file) {
                    importData(file);
                    e.target.value = '';
                }
            };

            return (
                <div className="space-y-8 fade-in text-white">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-slate-600/20 to-slate-500/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">⚙️</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Settings</h2>
                        <p className="text-slate-400 text-lg">
                            Manage your data and preferences
                        </p>
                    </div>

                    {user && (
                        <div className="glass rounded-2xl p-6 border border-emerald-500/30 bg-emerald-500/5">
                            <h3 className="font-bold text-emerald-300 mb-2 flex items-center">
                                <span className="mr-2">✓</span> Cloud Sync Enabled
                            </h3>
                            <p className="text-emerald-100/80 text-sm mb-2">
                                Your data is automatically syncing across all your devices in real-time.
                            </p>
                            <p className="text-emerald-400 text-xs font-mono bg-emerald-900/30 inline-block px-2 py-1 rounded">
                                Logged in as: {user.email}
                            </p>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="glass rounded-2xl p-8 border border-slate-700/50 hover:border-blue-500/30 transition-colors group">
                            <div className="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center text-2xl mb-4 text-blue-400 group-hover:scale-110 transition-transform">
                                📤
                            </div>
                            <h3 className="text-xl font-bold text-white mb-2">Export Data</h3>
                            <p className="text-slate-400 text-sm mb-6 min-h-[40px]">
                                Download a backup of all your goals, time blocks, and progress data.
                            </p>
                            <button
                                onClick={exportData}
                                className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2"
                            >
                                <span>Download Backup</span>
                            </button>
                        </div>

                        <div className="glass rounded-2xl p-8 border border-slate-700/50 hover:border-purple-500/30 transition-colors group">
                            <div className="w-12 h-12 rounded-xl bg-purple-500/20 flex items-center justify-center text-2xl mb-4 text-purple-400 group-hover:scale-110 transition-transform">
                                📥
                            </div>
                            <h3 className="text-xl font-bold text-white mb-2">Import Data</h3>
                            <p className="text-slate-400 text-sm mb-6 min-h-[40px]">
                                Restore your data from a previously exported backup file.
                            </p>
                            <div className="relative">
                                <input
                                    type="file"
                                    accept=".json"
                                    onChange={handleImport}
                                    className="block w-full text-sm text-slate-400
                                        file:mr-4 file:py-3 file:px-6
                                        file:rounded-xl file:border-0
                                        file:text-sm file:font-bold
                                        file:bg-purple-600 file:text-white
                                        hover:file:bg-purple-500
                                        cursor-pointer file:cursor-pointer file:transition-colors file:shadow-lg file:shadow-purple-500/30"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50 text-center">
                        <h3 className="text-xl font-bold text-white mb-4">About</h3>
                        <p className="text-slate-400 mb-6 max-w-2xl mx-auto leading-relaxed">
                            This app is based on "The ONE Thing" by Gary Keller and Jay Papasan.
                            It helps you identify and focus on the single most important task that
                            will make everything else easier or unnecessary.
                        </p>
                        <p className="text-xs text-slate-600 font-mono">
                            {user ?
                                'Your data is securely stored in the cloud and synced across all your devices.' :
                                'All data is stored locally in your browser. No information is sent to any server.'
                            }
                        </p>
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
