        function AuthScreen() {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (mode === 'login') {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGoogleSignIn = async () => {
                setError('');
                setLoading(true);

                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
                    {/* Background Blobs */}
                    <div className="absolute top-0 left-0 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow"></div>
                    <div className="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow animation-delay-2000"></div>

                    <div className="max-w-md w-full glass rounded-2xl p-8 relative z-10 animate-float">
                        <div className="text-center mb-10">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 shadow-glow">
                                <span className="text-4xl font-bold text-white">1</span>
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">The ONE Thing</h1>
                            <p className="text-slate-400">Focus on what matters most</p>
                        </div>

                        {/* Google Sign-In Button */}
                        <button
                            onClick={handleGoogleSignIn}
                            disabled={loading}
                            className="w-full bg-white text-gray-800 py-3 rounded-xl font-semibold hover:bg-gray-100 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 flex items-center justify-center space-x-3 mb-6 shadow-lg"
                        >
                            <svg className="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            <span>{loading ? 'Connecting...' : 'Continue with Google'}</span>
                        </button>

                        <div className="relative my-8">
                            <div className="absolute inset-0 flex items-center">
                                <div className="w-full border-t border-slate-700"></div>
                            </div>
                            <div className="relative flex justify-center text-sm">
                                <span className="px-4 bg-slate-800 text-slate-400 rounded-full">Or continue with email</span>
                            </div>
                        </div>

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2 ml-1">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-600 transition-all"
                                    placeholder="you@example.com"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2 ml-1">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    minLength="6"
                                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-600 transition-all"
                                    placeholder="••••••••"
                                />
                            </div>

                            {error && (
                                <div className="bg-red-500/10 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl text-sm flex items-center">
                                    <span className="mr-2">⚠️</span> {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-xl font-bold hover:shadow-glow transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
                            >
                                {loading ? 'Processing...' : mode === 'login' ? 'Log In' : 'Sign Up'}
                            </button>
                        </form>

                        <div className="mt-8 text-center">
                            <button
                                onClick={() => setMode(mode === 'login' ? 'signup' : 'login')}
                                className="text-indigo-400 hover:text-indigo-300 text-sm font-medium transition-colors"
                            >
                                {mode === 'login' ? "Don't have an account? Sign Up" : 'Already have an account? Log In'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // REFLECTION & PLANNING
        // ==========================================
        function Reflection({ 
            lifeAreas, 
            activeAreas, 
            selectedLifeArea, 
            setSelectedLifeArea, 
            saveMonthlyReview, 
            getCurrentMonthReview, 
            saveQuarterlyReview, 
            getCurrentQuarterReview, 
            addObstacleSolution,
            recordObstacleAttempt,
            deleteObstacleSolution,
            setObstacleWeeklyFocus,
            dayNotes,
            setDayNote,
            toggleLifeArea 
        }) {
            const [reflectionType, setReflectionType] = React.useState('monthly'); // 'monthly' | 'quarterly' | 'obstacles'

            return (
                <div className="space-y-8 fade-in">
                    {/* Reflection Type Toggle */}
                    <div className="flex justify-center">
                        <div className="glass p-1 rounded-2xl flex border border-slate-700/50">
                            <button
                                onClick={() => setReflectionType('monthly')}
                                className={`px-8 py-3 rounded-xl text-sm font-bold tracking-wider uppercase transition-all ${
                                    reflectionType === 'monthly'
                                        ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                Monthly
                            </button>
                            <button
                                onClick={() => setReflectionType('quarterly')}
                                className={`px-8 py-3 rounded-xl text-sm font-bold tracking-wider uppercase transition-all ${
                                    reflectionType === 'quarterly'
                                        ? 'bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                Quarterly
                            </button>
                            <button
                                onClick={() => setReflectionType('obstacles')}
                                className={`px-8 py-3 rounded-xl text-sm font-bold tracking-wider uppercase transition-all ${
                                    reflectionType === 'obstacles'
                                        ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                Obstacles
                            </button>
                            <button
                                onClick={() => setReflectionType('history')}
                                className={`px-8 py-3 rounded-xl text-sm font-bold tracking-wider uppercase transition-all ${
                                    reflectionType === 'history'
                                        ? 'bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                History
                            </button>
                        </div>
                    </div>

                    {reflectionType === 'monthly' ? (
                        <MonthlyReview
                            lifeAreas={lifeAreas}
                            activeAreas={activeAreas}
                            selectedLifeArea={selectedLifeArea}
                            setSelectedLifeArea={setSelectedLifeArea}
                            saveMonthlyReview={saveMonthlyReview}
                            getCurrentMonthReview={getCurrentMonthReview}
                            toggleLifeArea={toggleLifeArea}
                        />
                    ) : reflectionType === 'quarterly' ? (
                        <QuarterlyReview
                            lifeAreas={lifeAreas}
                            activeAreas={activeAreas}
                            selectedLifeArea={selectedLifeArea}
                            setSelectedLifeArea={setSelectedLifeArea}
                            saveQuarterlyReview={saveQuarterlyReview}
                            getCurrentQuarterReview={getCurrentQuarterReview}
                            toggleLifeArea={toggleLifeArea}
                        />
                    ) : reflectionType === 'obstacles' ? (
                        <ObstaclesSolutionsTracker
                            lifeAreas={lifeAreas}
                            activeAreas={activeAreas}
                            addObstacleSolution={addObstacleSolution}
                            recordObstacleAttempt={recordObstacleAttempt}
                            deleteObstacleSolution={deleteObstacleSolution}
                            setObstacleWeeklyFocus={setObstacleWeeklyFocus}
                            dayNotes={dayNotes}
                            setDayNote={setDayNote}
                        />
                    ) : (
                        <ReflectionHistoryBrowser
                            lifeAreas={lifeAreas}
                            activeAreas={activeAreas}
                            selectedLifeArea={selectedLifeArea}
                            setSelectedLifeArea={setSelectedLifeArea}
                            setReflectionType={setReflectionType}
                        />
                    )}
                </div>
            );
        }

        function ReflectionHistoryBrowser({ lifeAreas, activeAreas, selectedLifeArea, setSelectedLifeArea, setReflectionType }) {
            const [mode, setMode] = React.useState('monthly'); // monthly | quarterly
            const [selectedKey, setSelectedKey] = React.useState(null); // YYYY-MM | YYYY-Qn

            const getCurrentMonthKey = () => new Date().toISOString().substring(0, 7);
            const getCurrentQuarterKey = () => {
                const now = new Date();
                const year = now.getFullYear();
                const quarter = Math.floor(now.getMonth() / 3) + 1;
                return `${year}-Q${quarter}`;
            };

            const currentMonthKey = getCurrentMonthKey();
            const currentQuarterKey = getCurrentQuarterKey();

            React.useEffect(() => {
                if (selectedLifeArea && activeAreas.includes(selectedLifeArea)) return;
                if (activeAreas.length > 0) setSelectedLifeArea(activeAreas[0]);
            }, [selectedLifeArea, activeAreas, setSelectedLifeArea]);

            const area = selectedLifeArea ? lifeAreas[selectedLifeArea] : null;
            const monthlyList = area && area.reviews && Array.isArray(area.reviews.monthly) ? area.reviews.monthly.slice() : [];
            const quarterlyList = area && area.reviews && Array.isArray(area.reviews.quarterly) ? area.reviews.quarterly.slice() : [];
            monthlyList.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
            quarterlyList.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

            React.useEffect(() => {
                if (!selectedLifeArea) return;
                if (mode === 'monthly') {
                    if (selectedKey && String(selectedKey).length === 7) return;
                    if (monthlyList.length > 0) setSelectedKey(monthlyList[0].date);
                    else setSelectedKey(currentMonthKey);
                } else {
                    if (selectedKey && String(selectedKey).includes('-Q')) return;
                    if (quarterlyList.length > 0) setSelectedKey(quarterlyList[0].date);
                    else setSelectedKey(currentQuarterKey);
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [mode, selectedLifeArea]);

            const monthlyByKey = monthlyList.reduce((acc, r) => {
                if (r && r.date) acc[String(r.date)] = r;
                return acc;
            }, {});
            const quarterlyByKey = quarterlyList.reduce((acc, r) => {
                if (r && r.date) acc[String(r.date)] = r;
                return acc;
            }, {});

            const formatMonthLabel = (yyyyMm) => {
                const [y, m] = String(yyyyMm).split('-').map(Number);
                const d = new Date(y, (m || 1) - 1, 1);
                return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
            };

            const completionOverview = activeAreas.map((areaKey) => {
                const a = lifeAreas[areaKey];
                const monthlyDone = Boolean(a && a.reviews && Array.isArray(a.reviews.monthly) && a.reviews.monthly.some(r => r && r.date === currentMonthKey));
                const quarterlyDone = Boolean(a && a.reviews && Array.isArray(a.reviews.quarterly) && a.reviews.quarterly.some(r => r && r.date === currentQuarterKey));
                return { areaKey, monthlyDone, quarterlyDone };
            });

            const selectedMonthly = selectedKey ? monthlyByKey[String(selectedKey)] : null;
            const selectedQuarterly = selectedKey ? quarterlyByKey[String(selectedKey)] : null;
            const selectedQuarterConfig = (() => {
                if (!selectedQuarterly || !selectedQuarterly.date) return null;
                const q = String(selectedQuarterly.date).split('-Q')[1];
                const quarterKey = q ? `Q${q}` : null;
                return quarterKey && QUARTERLY_CONFIG[quarterKey] ? QUARTERLY_CONFIG[quarterKey] : null;
            })();

            return (
                <div className="space-y-8 fade-in">
                    <div className="glass rounded-2xl p-8 border-l-4 border-emerald-500">
                        <h2 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500 mb-2">
                            Reflection History
                        </h2>
                        <p className="text-slate-400 text-lg">
                            Browse past reflections and see what’s complete across your life areas.
                        </p>
                    </div>

                    <div className="glass rounded-2xl p-6 border border-slate-700/50">
                        <div className="flex items-center justify-between flex-wrap gap-4">
                            <div className="text-left">
                                <div className="text-xs font-bold text-slate-500 uppercase tracking-widest">Completion overview</div>
                                <div className="text-sm text-slate-300 mt-2">
                                    Current month: <span className="font-mono text-slate-200">{currentMonthKey}</span> · Current quarter:{' '}
                                    <span className="font-mono text-slate-200">{currentQuarterKey}</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button
                                    type="button"
                                    onClick={() => setMode('monthly')}
                                    className={`px-4 py-2 rounded-xl border text-sm font-bold transition-all ${
                                        mode === 'monthly'
                                            ? 'bg-cyan-500/15 border-cyan-500/30 text-cyan-200'
                                            : 'bg-slate-800/40 border-slate-700 text-slate-300 hover:bg-slate-800 hover:border-slate-600'
                                    }`}
                                >
                                    Monthly
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setMode('quarterly')}
                                    className={`px-4 py-2 rounded-xl border text-sm font-bold transition-all ${
                                        mode === 'quarterly'
                                            ? 'bg-purple-500/15 border-purple-500/30 text-purple-200'
                                            : 'bg-slate-800/40 border-slate-700 text-slate-300 hover:bg-slate-800 hover:border-slate-600'
                                    }`}
                                >
                                    Quarterly
                                </button>
                            </div>
                        </div>

                        <div className="mt-5 grid grid-cols-1 md:grid-cols-3 gap-3">
                            {completionOverview.map((row) => {
                                const info = LIFE_AREAS[row.areaKey] || LIFE_AREAS.business;
                                return (
                                    <div key={row.areaKey} className="rounded-2xl border border-slate-700/60 bg-slate-800/30 p-4">
                                        <div className="flex items-center justify-between gap-4">
                                            <button
                                                type="button"
                                                onClick={() => setSelectedLifeArea(row.areaKey)}
                                                className="flex items-center gap-2 text-left"
                                            >
                                                <span className="text-xl">{info.icon}</span>
                                                <span className="font-bold text-slate-100">{info.name}</span>
                                            </button>
                                            <div className="flex items-center gap-2">
                                                <span className={`text-[10px] font-black px-2 py-1 rounded-full border ${
                                                    row.monthlyDone ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-slate-900/30 border-slate-700 text-slate-400'
                                                }`}>
                                                    M {row.monthlyDone ? 'DONE' : 'MISS'}
                                                </span>
                                                <span className={`text-[10px] font-black px-2 py-1 rounded-full border ${
                                                    row.quarterlyDone ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-slate-900/30 border-slate-700 text-slate-400'
                                                }`}>
                                                    Q {row.quarterlyDone ? 'DONE' : 'MISS'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-6 border border-slate-700/50">
                        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                            <div className="flex flex-col gap-2">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Life area</label>
                                <select
                                    value={selectedLifeArea || ''}
                                    onChange={(e) => setSelectedLifeArea(e.target.value)}
                                    className="px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all"
                                >
                                    {activeAreas.map((areaKey) => (
                                        <option key={areaKey} value={areaKey}>
                                            {LIFE_AREAS[areaKey]?.icon || ''} {LIFE_AREAS[areaKey]?.name || areaKey}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="flex flex-col gap-2">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">
                                    {mode === 'monthly' ? 'Month' : 'Quarter'}
                                </label>
                                <select
                                    value={selectedKey || ''}
                                    onChange={(e) => setSelectedKey(e.target.value)}
                                    className="px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all"
                                >
                                    {mode === 'monthly' ? (
                                        monthlyList.length === 0 ? (
                                            <option value={currentMonthKey}>{currentMonthKey} (no saved review)</option>
                                        ) : (
                                            monthlyList.map((r) => (
                                                <option key={r.date} value={r.date}>
                                                    {formatMonthLabel(r.date)} ({r.date})
                                                </option>
                                            ))
                                        )
                                    ) : (
                                        quarterlyList.length === 0 ? (
                                            <option value={currentQuarterKey}>{currentQuarterKey} (no saved review)</option>
                                        ) : (
                                            quarterlyList.map((r) => (
                                                <option key={r.date} value={r.date}>
                                                    {r.date}
                                                </option>
                                            ))
                                        )
                                    )}
                                </select>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    type="button"
                                    onClick={() => {
                                        if (!selectedLifeArea) return;
                                        if (mode === 'monthly') setReflectionType('monthly');
                                        else setReflectionType('quarterly');
                                    }}
                                    className="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 hover:border-slate-600 font-bold transition-all"
                                    title="Edit using the main Monthly/Quarterly screens"
                                >
                                    Edit current
                                </button>
                            </div>
                        </div>
                    </div>

                    {mode === 'monthly' ? (
                        <div className="glass rounded-2xl p-8 border border-slate-700/50">
                            <h3 className="text-xl font-bold text-white mb-6">Monthly Review</h3>
                            {!selectedMonthly ? (
                                <div className="text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl p-6 text-center">
                                    No saved monthly review found for this selection.
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">1. Accomplished</div>
                                        <div className="text-slate-200 whitespace-pre-wrap">{selectedMonthly.accomplished || '—'}</div>
                                    </div>
                                    <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">2. Do differently</div>
                                        <div className="text-slate-200 whitespace-pre-wrap">{selectedMonthly.doDifferently || '—'}</div>
                                    </div>
                                    <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">3. Priorities</div>
                                        <div className="text-slate-200 whitespace-pre-wrap">{selectedMonthly.priorities || '—'}</div>
                                    </div>
                                    <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">4–5. Obstacles & solutions</div>
                                        <div className="space-y-3">
                                            {[0, 1, 2].map((i) => (
                                                <div key={`os:${i}`} className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    <div className="rounded-xl border border-slate-700/60 bg-slate-800/30 p-4">
                                                        <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Obstacle {i + 1}</div>
                                                        <div className="text-slate-200 mt-2 whitespace-pre-wrap">
                                                            {selectedMonthly.obstacles && selectedMonthly.obstacles[i] ? selectedMonthly.obstacles[i] : '—'}
                                                        </div>
                                                    </div>
                                                    <div className="rounded-xl border border-slate-700/60 bg-slate-800/30 p-4">
                                                        <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Solution {i + 1}</div>
                                                        <div className="text-slate-200 mt-2 whitespace-pre-wrap">
                                                            {selectedMonthly.solutions && selectedMonthly.solutions[i] ? selectedMonthly.solutions[i] : '—'}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="glass rounded-2xl p-8 border border-slate-700/50">
                            <h3 className="text-xl font-bold text-white mb-6">Quarterly Review</h3>
                            {!selectedQuarterly ? (
                                <div className="text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl p-6 text-center">
                                    No saved quarterly review found for this selection.
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Reflection</div>
                                        <div className="space-y-4 mt-4">
                                            {(selectedQuarterConfig && Array.isArray(selectedQuarterConfig.questions) ? selectedQuarterConfig.questions : ['Q1', 'Q2', 'Q3', 'Q4', 'Q5'])
                                                .slice(0, 5)
                                                .map((q, idx) => {
                                                    const key = `q${idx + 1}`;
                                                    return (
                                                        <div key={`${selectedQuarterly.date}:q:${idx}`} className="rounded-xl border border-slate-700/60 bg-slate-800/30 p-4">
                                                            <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{idx + 1}. {q}</div>
                                                            <div className="text-slate-200 mt-2 whitespace-pre-wrap">
                                                                {selectedQuarterly[key] || '—'}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                        </div>
                                    </div>

                                    {selectedQuarterConfig && Array.isArray(selectedQuarterConfig.checklist) && (
                                        <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
                                            <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Actions</div>
                                            <div className="space-y-3">
                                                {selectedQuarterConfig.checklist.map((item, idx) => {
                                                    const checked = Boolean(selectedQuarterly.actions && selectedQuarterly.actions[idx]);
                                                    return (
                                                        <div key={`${selectedQuarterly.date}:a:${idx}`} className="flex items-start gap-3">
                                                            <div className={`mt-1 w-5 h-5 rounded-md border flex items-center justify-center ${
                                                                checked ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-200' : 'border-slate-600 text-slate-600'
                                                            }`}>
                                                                {checked ? '✓' : ''}
                                                            </div>
                                                            <div className={`text-sm ${checked ? 'text-slate-300 line-through opacity-70' : 'text-slate-200'}`}>
                                                                {item}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function ObstaclesSolutionsTracker({ lifeAreas, activeAreas, addObstacleSolution, recordObstacleAttempt, deleteObstacleSolution, setObstacleWeeklyFocus, dayNotes = {}, setDayNote }) {
            const [scopeArea, setScopeArea] = React.useState('all'); // 'all' | areaKey
            const [newObstacle, setNewObstacle] = React.useState('');
            const [newSolution, setNewSolution] = React.useState('');
            const [attemptDate, setAttemptDate] = React.useState(() => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            });

            React.useEffect(() => {
                if (scopeArea === 'all') return;
                if (!activeAreas.includes(scopeArea)) setScopeArea('all');
            }, [scopeArea, activeAreas]);

            const normalize = (s) => String(s || '').trim().toLowerCase();

            const getWeekKey = (dateStr) => {
                const [y, m, d] = String(dateStr).split('-').map(Number);
                const dateObj = new Date(y, (m || 1) - 1, d || 1);
                dateObj.setHours(0, 0, 0, 0);
                dateObj.setDate(dateObj.getDate() + 3 - ((dateObj.getDay() + 6) % 7));
                const week1 = new Date(dateObj.getFullYear(), 0, 4);
                const week = 1 + Math.round(((dateObj - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
                const year = dateObj.getFullYear();
                return `${year}-W${String(week).padStart(2, '0')}`;
            };

            const todayStr = (() => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            })();
            const thisWeekKey = getWeekKey(todayStr);

            const reviewPairs = [];
            activeAreas.forEach((areaKey) => {
                if (scopeArea !== 'all' && areaKey !== scopeArea) return;
                const area = lifeAreas[areaKey];
                const monthly = area && area.reviews && Array.isArray(area.reviews.monthly) ? area.reviews.monthly : [];
                monthly.forEach((review) => {
                    const obstacles = review && Array.isArray(review.obstacles) ? review.obstacles : [];
                    const solutions = review && Array.isArray(review.solutions) ? review.solutions : [];
                    for (let i = 0; i < Math.max(obstacles.length, solutions.length, 3); i++) {
                        const obstacle = (obstacles[i] || '').trim();
                        const solution = (solutions[i] || '').trim();
                        if (!obstacle) continue;
                        reviewPairs.push({
                            areaKey,
                            month: review && review.date ? String(review.date) : null,
                            obstacle,
                            solution
                        });
                    }
                });
            });

            const aggregated = {};
            reviewPairs.forEach((item) => {
                const key = normalize(item.obstacle);
                if (!key) return;
                if (!aggregated[key]) {
                    aggregated[key] = {
                        obstacle: item.obstacle,
                        count: 0,
                        areas: new Set(),
                        lastSeen: item.month || null,
                        solutions: {}
                    };
                }
                const row = aggregated[key];
                row.count += 1;
                row.areas.add(item.areaKey);
                if (item.month && (!row.lastSeen || item.month > row.lastSeen)) row.lastSeen = item.month;
                if (item.solution) {
                    const sKey = normalize(item.solution);
                    if (!row.solutions[sKey]) row.solutions[sKey] = { text: item.solution, count: 0 };
                    row.solutions[sKey].count += 1;
                }
            });

            const aggregatedList = Object.values(aggregated)
                .map((row) => {
                    const topSolutions = Object.values(row.solutions)
                        .sort((a, b) => (b.count || 0) - (a.count || 0))
                        .slice(0, 3);
                    return {
                        obstacle: row.obstacle,
                        count: row.count,
                        lastSeen: row.lastSeen,
                        areasCount: row.areas.size,
                        topSolutions
                    };
                })
                .sort((a, b) => (b.count || 0) - (a.count || 0));

            const pinned = scopeArea !== 'all' && lifeAreas[scopeArea] && Array.isArray(lifeAreas[scopeArea].obstaclesSolutions)
                ? lifeAreas[scopeArea].obstaclesSolutions
                : [];
            const pinnedSet = new Set(pinned.map((p) => normalize(p && p.obstacle)));
            const focus = scopeArea !== 'all' && lifeAreas[scopeArea] ? lifeAreas[scopeArea].obstacleWeeklyFocus : null;
            const focusEntryId = focus && focus.weekKey === thisWeekKey ? focus.entryId : null;

            return (
                <div className="space-y-8 fade-in">
                    <div className="glass rounded-2xl p-8 border-l-4 border-amber-500">
                        <h2 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-2">
                            Obstacles & Solutions
                        </h2>
                        <p className="text-slate-400 text-lg">
                            Spot patterns, pin solutions, and track what actually works.
                        </p>
                    </div>

                    <div className="glass rounded-2xl p-6 border border-slate-700/50">
                        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                            <div className="flex flex-col gap-2">
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Scope</label>
                                <select
                                    value={scopeArea}
                                    onChange={(e) => setScopeArea(e.target.value)}
                                    className="px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all"
                                >
                                    <option value="all">All Active Areas</option>
                                    {activeAreas.map((areaKey) => (
                                        <option key={areaKey} value={areaKey}>
                                            {LIFE_AREAS[areaKey]?.icon || ''} {LIFE_AREAS[areaKey]?.name || areaKey}
                                        </option>
                                    ))}
                                </select>
                                <div className="text-xs text-slate-500">
                                    Aggregates obstacles from your Monthly Reflections (Q4/Q5).
                                </div>
                            </div>

                            {scopeArea !== 'all' && (
                                <div className="flex-1">
                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Add a pinned obstacle</label>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                                        <input
                                            value={newObstacle}
                                            onChange={(e) => setNewObstacle(e.target.value)}
                                            className="px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-500/30 transition-all"
                                            placeholder="Obstacle (e.g., 'No time after work')"
                                        />
                                        <input
                                            value={newSolution}
                                            onChange={(e) => setNewSolution(e.target.value)}
                                            className="px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-orange-500/30 transition-all"
                                            placeholder="Solution (optional)"
                                        />
                                    </div>
                                    <div className="flex items-center gap-3 mt-3">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                if (typeof addObstacleSolution === 'function') addObstacleSolution(scopeArea, newObstacle, newSolution);
                                                setNewObstacle('');
                                                setNewSolution('');
                                            }}
                                            className="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold shadow-lg hover:shadow-orange-500/30 transition-all transform hover:-translate-y-0.5"
                                        >
                                            Add
                                        </button>
                                        <div className="text-xs text-slate-500">
                                            Pinned items are saved to this life area.
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {scopeArea !== 'all' && (
                        <div className="glass rounded-2xl p-8 border border-slate-700/50">
                            <h3 className="text-xl font-bold text-white mb-6 flex items-center">
                                Pinned ({pinned.length})
                            </h3>
                            {pinned.length === 0 ? (
                                <div className="text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl p-6 text-center">
                                    Pin obstacles you want to actively work on.
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {pinned.map((item) => {
                                        const tried = item.triedCount || 0;
                                        const worked = item.workedCount || 0;
                                        const rate = tried > 0 ? Math.round((worked / tried) * 100) : null;
                                        const attempts = Array.isArray(item.attempts) ? item.attempts : [];
                                        const thisWeekAttempts = attempts.filter((a) => a && a.date && getWeekKey(a.date) === thisWeekKey);
                                        const thisWeekTried = thisWeekAttempts.length;
                                        const thisWeekWorked = thisWeekAttempts.filter((a) => a.worked).length;
                                        const isFocused = focusEntryId && item.id === focusEntryId;
                                        return (
                                            <div key={item.id} className="rounded-2xl border border-slate-700/60 bg-slate-800/30 p-5">
                                                <div className="flex items-start justify-between gap-4">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2">
                                                            <div className="text-white font-bold">{item.obstacle}</div>
                                                            {isFocused && (
                                                                <span className="text-[10px] font-black px-2 py-1 rounded-full border bg-emerald-500/10 border-emerald-500/30 text-emerald-200">
                                                                    Focus this week
                                                                </span>
                                                            )}
                                                        </div>
                                                        {item.solution && (
                                                            <div className="text-slate-300 mt-2">
                                                                <span className="text-slate-500 font-mono text-xs mr-2">Solution</span>
                                                                {item.solution}
                                                            </div>
                                                        )}
                                                        <div className="text-xs text-slate-500 mt-3">
                                                            Tried: <span className="text-slate-300 font-mono">{tried}</span> · Worked: <span className="text-slate-300 font-mono">{worked}</span>
                                                            {rate !== null && (
                                                                <>
                                                                    {' '}· Success: <span className="text-emerald-300 font-mono">{rate}%</span>
                                                                </>
                                                            )}
                                                        </div>
                                                        <div className="text-xs text-slate-500 mt-2">
                                                            This week: <span className="text-slate-300 font-mono">{thisWeekTried}</span> tries ·{' '}
                                                            <span className="text-slate-300 font-mono">{thisWeekWorked}</span> worked
                                                        </div>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            const ok = window.confirm('Delete this pinned obstacle?');
                                                            if (!ok) return;
                                                            if (typeof deleteObstacleSolution === 'function') deleteObstacleSolution(scopeArea, item.id);
                                                        }}
                                                        className="px-3 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-200 border border-red-500/30"
                                                    >
                                                        Delete
                                                    </button>
                                                </div>
                                                <div className="flex flex-wrap items-center gap-2 mt-4">
                                                    <button
                                                        type="button"
                                                        onClick={() => typeof setObstacleWeeklyFocus === 'function' && setObstacleWeeklyFocus(scopeArea, item.id)}
                                                        className={`px-4 py-2 rounded-xl border text-sm font-bold transition-all ${
                                                            isFocused
                                                                ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200'
                                                                : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                                                        }`}
                                                    >
                                                        {isFocused ? 'Focused' : 'Set focus'}
                                                    </button>
                                                    {isFocused && (
                                                        <button
                                                            type="button"
                                                            onClick={() => typeof setObstacleWeeklyFocus === 'function' && setObstacleWeeklyFocus(scopeArea, null)}
                                                            className="px-4 py-2 rounded-xl bg-slate-900/30 hover:bg-slate-800 text-slate-300 border border-slate-700 text-sm font-bold"
                                                        >
                                                            Clear focus
                                                        </button>
                                                    )}
                                                    <input
                                                        type="date"
                                                        value={attemptDate}
                                                        onChange={(e) => setAttemptDate(e.target.value)}
                                                        className="px-3 py-2 rounded-xl bg-slate-900/40 border border-slate-700 text-slate-200 text-sm"
                                                    />
                                                    <button
                                                        type="button"
                                                        onClick={() => typeof recordObstacleAttempt === 'function' && recordObstacleAttempt(scopeArea, item.id, true, attemptDate)}
                                                        className="px-4 py-2 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/15 text-emerald-200 border border-emerald-500/30 text-sm font-bold"
                                                    >
                                                        Log worked
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => typeof recordObstacleAttempt === 'function' && recordObstacleAttempt(scopeArea, item.id, false, attemptDate)}
                                                        className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-bold"
                                                    >
                                                        Log didn’t
                                                    </button>
                                                </div>

                                                <div className="mt-5">
                                                    <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">
                                                        Timeline
                                                    </div>
                                                    {attempts.length === 0 ? (
                                                        <div className="text-xs text-slate-500 border border-slate-800/60 rounded-xl p-4 bg-slate-900/20">
                                                            No attempts logged yet.
                                                        </div>
                                                    ) : (
                                                        <div className="space-y-2">
                                                            {attempts.slice(0, 8).map((a, idx) => {
                                                                const note = a && a.date && dayNotes && dayNotes[a.date] ? dayNotes[a.date].text : '';
                                                                return (
                                                                    <div key={`${item.id}:att:${idx}`} className="rounded-xl border border-slate-700/60 bg-slate-900/20 p-3">
                                                                        <div className="flex items-start justify-between gap-3">
                                                                            <div>
                                                                                <div className="text-sm text-slate-200 font-mono">{a.date}</div>
                                                                                <div className={`text-xs font-bold mt-1 ${a.worked ? 'text-emerald-300' : 'text-rose-300'}`}>
                                                                                    {a.worked ? 'Worked' : 'Didn’t work'}
                                                                                </div>
                                                                                {note && (
                                                                                    <div className="text-xs text-slate-400 mt-2">
                                                                                        Note: {String(note).slice(0, 120)}{note.length > 120 ? '…' : ''}
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => {
                                                                                    if (typeof setDayNote !== 'function') return;
                                                                                    const current = a && a.date && dayNotes && dayNotes[a.date] ? dayNotes[a.date].text : '';
                                                                                    const next = window.prompt(`Edit note for ${a.date}:`, current || '');
                                                                                    if (next === null) return;
                                                                                    setDayNote(a.date, next);
                                                                                }}
                                                                                className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold"
                                                                            >
                                                                                Edit note
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    <div className="glass rounded-2xl p-8 border border-slate-700/50">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center">
                            From Monthly Reflections ({aggregatedList.length})
                        </h3>
                        {aggregatedList.length === 0 ? (
                            <div className="text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl p-6 text-center">
                                No obstacles found yet. Fill out Monthly Reflections to start building patterns.
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {aggregatedList.slice(0, 30).map((row, idx) => (
                                    <div key={`${row.obstacle}:${idx}`} className="rounded-2xl border border-slate-700/60 bg-slate-800/30 p-5">
                                        <div className="flex items-start justify-between gap-4">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-3">
                                                    <div className="text-white font-bold">{row.obstacle}</div>
                                                    <span className="text-xs font-mono px-2 py-0.5 rounded-full border border-slate-700 bg-slate-900/40 text-slate-300">
                                                        ×{row.count}
                                                    </span>
                                                    {scopeArea === 'all' && (
                                                        <span className="text-xs text-slate-500">
                                                            in {row.areasCount} area{row.areasCount === 1 ? '' : 's'}
                                                        </span>
                                                    )}
                                                </div>
                                                {row.topSolutions.length > 0 && (
                                                    <div className="flex flex-wrap gap-2 mt-3">
                                                        {row.topSolutions.map((s, sIdx) => (
                                                            <span
                                                                key={`${row.obstacle}:sol:${sIdx}`}
                                                                className="px-3 py-1.5 rounded-full text-xs font-bold border bg-slate-900/30 border-slate-700 text-slate-200"
                                                                title={`Mentioned ${s.count} time${s.count === 1 ? '' : 's'}`}
                                                            >
                                                                {s.text}
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                                {row.lastSeen && (
                                                    <div className="text-xs text-slate-500 mt-3">
                                                        Last seen: <span className="font-mono text-slate-300">{row.lastSeen}</span>
                                                    </div>
                                                )}
                                            </div>
                                            {scopeArea !== 'all' && (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const suggestedSolution = row.topSolutions && row.topSolutions[0] ? row.topSolutions[0].text : '';
                                                        if (typeof addObstacleSolution === 'function') addObstacleSolution(scopeArea, row.obstacle, suggestedSolution);
                                                    }}
                                                    disabled={pinnedSet.has(normalize(row.obstacle))}
                                                    className={`px-4 py-2 rounded-xl border text-sm font-bold transition-all ${
                                                        pinnedSet.has(normalize(row.obstacle))
                                                            ? 'bg-slate-800/40 border-slate-700 text-slate-500 cursor-not-allowed'
                                                            : 'bg-amber-500/10 hover:bg-amber-500/15 text-amber-200 border-amber-500/30'
                                                    }`}
                                                >
                                                    {pinnedSet.has(normalize(row.obstacle)) ? 'Pinned' : 'Pin'}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function MonthlyReview({ lifeAreas, activeAreas, selectedLifeArea, setSelectedLifeArea, saveMonthlyReview, getCurrentMonthReview, toggleLifeArea }) {
            const [formData, setFormData] = React.useState({
                accomplished: '',
                doDifferently: '',
                priorities: '',
                obstacles: ['', '', ''],
                solutions: ['', '', '']
            });
            const [showSaved, setShowSaved] = React.useState(false);

            const currentMonth = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long' });

            // Auto-load function
            React.useEffect(() => {
                if (selectedLifeArea) {
                    const existing = getCurrentMonthReview(selectedLifeArea);
                    if (existing) {
                        setFormData({
                            accomplished: existing.accomplished || '',
                            doDifferently: existing.doDifferently || '',
                            priorities: existing.priorities || '',
                            obstacles: existing.obstacles || ['', '', ''],
                            solutions: existing.solutions || ['', '', '']
                        });
                    } else {
                        setFormData({
                            accomplished: '',
                            doDifferently: '',
                            priorities: '',
                            obstacles: ['', '', ''],
                            solutions: ['', '', '']
                        });
                    }
                }
            }, [selectedLifeArea]);

            // Manual save function
            const handleSave = () => {
                if (!selectedLifeArea) return;
                saveMonthlyReview(selectedLifeArea, formData);
                setShowSaved(true);
                setTimeout(() => setShowSaved(false), 2000);
            };

            const updateObstacle = (index, value) => {
                const newObstacles = [...formData.obstacles];
                newObstacles[index] = value;
                setFormData({ ...formData, obstacles: newObstacles });
            };

            const updateSolution = (index, value) => {
                const newSolutions = [...formData.solutions];
                newSolutions[index] = value;
                setFormData({ ...formData, solutions: newSolutions });
            };

            return (
                <div className="space-y-8 fade-in">
                    {/* Header */}
                    <div className="glass rounded-2xl p-8 border-l-4 border-cyan-500">
                        <h2 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
                            Monthly Reflection
                        </h2>
                        <p className="text-slate-400 text-lg">Review your progress for {currentMonth}</p>
                    </div>

                    {/* Life Area Selector */}
                    <div className="glass rounded-2xl p-6 border border-slate-700/50">

                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-3">
                                {activeAreas.map(areaKey => {
                                    const area = LIFE_AREAS[areaKey];
                                    const isSelected = selectedLifeArea === areaKey;
                                    return (
                                        <button
                                            key={areaKey}
                                            onClick={() => setSelectedLifeArea(areaKey)}
                                            className={`px-5 py-3 rounded-xl border transition-all transform hover:scale-105 ${
                                                isSelected
                                                    ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white border-transparent shadow-glow'
                                                    : 'bg-slate-800/50 text-slate-300 border-slate-700 hover:border-indigo-500/50'
                                            }`}
                                        >
                                            <span className="mr-2">{area.icon}</span>
                                            {area.name}
                                        </button>
                                    );

                            </div>

                    {selectedLifeArea && (
                        <>
                            {/* Load/Save Controls */}
                            <div className="flex items-center gap-4">
                                <button
                                    onClick={handleSave}

                                    Save Reflection

	        // ==========================================
	        // DASHBOARD
	        // ==========================================
	        function DailyOneThingEditor({ areaKey, dateStr, isToday, dailyEntry, updateGoal, completeDaily, suggestions = [] }) {
	            const [draft, setDraft] = React.useState(dailyEntry.text || '');
	            const [editing, setEditing] = React.useState(!dailyEntry.completed);
	            const [saved, setSaved] = React.useState(false);
	            const [autosaveEnabled, setAutosaveEnabled] = React.useState(() => {
	                try {
	                    const raw = localStorage.getItem('oneThingAutosaveDaily');
	                    if (raw === null) return true;
	                    return raw === '1';
	                } catch {
	                    return true;
	                }
	            });
	            const [autosaveStatus, setAutosaveStatus] = React.useState('idle'); // idle | pending | saved
	            const [isDirty, setIsDirty] = React.useState(false);
	            const isFocusedRef = React.useRef(false);
	            const lastKeyRef = React.useRef(`${areaKey}:${dateStr}`);
	            const autosaveTimerRef = React.useRef(null);
	            const savedTimerRef = React.useRef(null);
	
	            React.useEffect(() => {
	                try {
	                    localStorage.setItem('oneThingAutosaveDaily', autosaveEnabled ? '1' : '0');
	                } catch {
	                    // ignore
	                }
	            }, [autosaveEnabled]);
	
	            React.useEffect(() => {
	                return () => {
	                    if (autosaveTimerRef.current) window.clearTimeout(autosaveTimerRef.current);
	                    if (savedTimerRef.current) window.clearTimeout(savedTimerRef.current);
	                };
	            }, []);

	            React.useEffect(() => {
	                const key = `${areaKey}:${dateStr}`;
	                const keyChanged = lastKeyRef.current !== key;
	                if (keyChanged) {
	                    lastKeyRef.current = key;
	                    setDraft(dailyEntry.text || '');
	                    setEditing(!dailyEntry.completed);
	                    setAutosaveStatus('idle');
	                    setIsDirty(false);
	                    return;
	                }

	                // If Firestore snapshot updates come in while the user is typing, don’t clobber their draft.
	                if (isFocusedRef.current || isDirty) return;
	                setDraft(dailyEntry.text || '');
	                setEditing(!dailyEntry.completed);
	            }, [areaKey, dateStr, dailyEntry.completed, dailyEntry.text, isDirty]);

	            const saveDraft = () => {
	                if (autosaveTimerRef.current) window.clearTimeout(autosaveTimerRef.current);
	                updateGoal(areaKey, 'daily', draft, dateStr);
	                setAutosaveStatus('saved');
	                setSaved(true);
	                setIsDirty(false);
	                if (savedTimerRef.current) window.clearTimeout(savedTimerRef.current);
	                savedTimerRef.current = window.setTimeout(() => {
	                    setSaved(false);
	                    setAutosaveStatus('idle');
	                }, 1200);
	            };

	            const scheduleAutosave = () => {
	                if (!autosaveEnabled) return;
	                if (dailyEntry.completed) return;
	                if (autosaveTimerRef.current) window.clearTimeout(autosaveTimerRef.current);
	                setAutosaveStatus('pending');
	                autosaveTimerRef.current = window.setTimeout(() => {
	                    saveDraft();
	                }, 900);
	            };

	            const applySuggestion = (text) => {
	                setDraft(text || '');
	                setIsDirty(true);
	                scheduleAutosave();
	            };

	            if (dailyEntry.completed && !editing) {
	                return (
	                    <div className="relative overflow-hidden rounded-xl bg-emerald-500/10 border border-emerald-500/20 p-4 group-hover:border-emerald-500/30 transition-colors group/completed">
	                        <div className="flex items-center justify-between gap-4">
	                            <div className="flex items-center gap-4">
	                                <div className="flex-shrink-0 w-12 h-12 rounded-full bg-emerald-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
	                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
	                                </div>
	                                <div>
	                                    <p className="text-lg font-medium text-emerald-100 line-through opacity-50">
	                                        {dailyEntry.text}
	                                    </p>
	                                    <p className="text-xs font-bold text-emerald-400 uppercase tracking-wider mt-1">Completed</p>
	                                </div>
	                            </div>
	                            <div className="flex items-center gap-2">
	                                <button
	                                    onClick={() => setEditing(true)}
	                                    className="opacity-0 group-hover/completed:opacity-100 transition-opacity px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-800 rounded-lg border border-slate-700/50"
	                                    title="Edit goal text"
	                                >
	                                    Edit
	                                </button>
	                                <button
	                                    onClick={() => completeDaily(areaKey, dateStr)}
	                                    className="opacity-0 group-hover/completed:opacity-100 transition-opacity px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-red-400 bg-slate-800/50 hover:bg-slate-800 rounded-lg border border-slate-700/50 hover:border-red-500/30"
	                                    title="Undo completion"
	                                >
	                                    Undo
	                                </button>
	                            </div>

	                return () => {

	                };

	            React.useEffect(() => {
	                const key = `${areaKey}:${dateStr}`;
	                const keyChanged = lastKeyRef.current !== key;
	                const nextText = rightNowEntry && typeof rightNowEntry.text === 'string' ? rightNowEntry.text : '';

	                    lastKeyRef.current = key;
	                    setDraft(nextText || '');

	                setIsDirty(false);
	                if (savedTimerRef.current) window.clearTimeout(savedTimerRef.current);
	                savedTimerRef.current = window.setTimeout(() => {
	                    setSaved(false);
	                    setSaveStatus('idle');

	                if (autosaveTimerRef.current) window.clearTimeout(autosaveTimerRef.current);
