            pointer-events: none;

        .grid-glow {
            position: fixed;

            left: 0;

            bottom: 0;
            right: 0;

            from {

            width: 100%;
            height: 100px;

            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(6, 182, 212, 0.1) 50%, rgba(0, 0, 0, 0) 100%);

            position: absolute;
            bottom: 100%;

            border-left-color: var(--neon-cyan);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>

        const LIFE_AREAS = {

        const QUARTERLY_CONFIG = {

                questions: [

                checklist: [

                    "Make care of important personal dates (birthdays, holidays, anniversaries)",
                    "Time block your Mid-Year RESET Retreat"
                ]
            },
            Q3: {
                title: "RESET",
                subtitle: "How are you doing on your goals? Whether you're on track or struggling to catch up, the middle of the year is the perfect time for a RESET Retreat. A RESET isn't simply hitting a reset button and starting over—it is your opportunity to reflect and change. While reflection is a powerful tool for forecasting and designing a more intentional future, thoughtfully look at your past without judgment in order to take the best possible step for a more successful future.",
                questions: [

            Q4: {

                questions: [

                checklist: [

        const createEmptyGoals = () => ({
            someday: { text: '', updatedAt: null },
            fiveYear: { text: '', updatedAt: null },
            // Annual (1-Year) - up to 5 goals in priority order
            annualGoals: [
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null }
            ],
            annualOneThingIndex: 0, // Which of the 5 is THE ONE (0-4)
            // Monthly - up to 5 goals in priority order
            monthlyGoals: [
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null }
            ],
            monthlyOneThingIndex: 0, // Which of the 5 is THE ONE (0-4)
            // Weekly - up to 5 goals in priority order
            weeklyGoals: [
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null }
            ],
            weeklyOneThingIndex: 0, // Which of the 5 is THE ONE (0-4)
            // Daily History - Keyed by YYYY-MM-DD
            dailyHistory: {} 
        });

        const getInitialState = () => ({
            version: 7, // Track data version for migrations (v7 = daily history)
            lifeAreas: Object.keys(LIFE_AREAS).reduce((acc, key) => {
                acc[key] = {
                    active: key === 'business', // Default Business to active to prevent lockout
                    goals: createEmptyGoals(),
                    completions: [], // Deprecated in v7, kept for safety during migration
                    reviews: {
                        monthly: [],
                        quarterly: []
                    }
                };
                return acc;
            }, {}),
            timeBlocks: [],
            currentQuoteIndex: 0,
            // 4-1-1 System tracking
            lastWeeklyReview: null,  // ISO date of last weekly review
            lastAnnualReview: null   // ISO date of last annual review
        });

	        // Migrate old data format to new multi-goal format
	        const migrateData = (oldData) => {
	            if (!oldData || typeof oldData !== 'object') {
	                return getInitialState();
	            }
	
	            const parsedVersion = Number.parseInt(oldData.version, 10);
	            const version = Number.isFinite(parsedVersion) ? parsedVersion : 1;
	
	            // REPAIR: Check for broken V7 data (V7 flag but V4/V6 structure)
	            // This happens if V1 fallback returned V7 state with V4 structure
	            if (version === 7) {
	                let needsRepair = false;
	                const activeAreas = Object.keys(oldData.lifeAreas || {});
                
                // Check if any area has 'daily' goal but no 'dailyHistory'
                for (const key of activeAreas) {
                    const goals = oldData.lifeAreas[key].goals;
                    if (goals && goals.daily && !goals.dailyHistory) {
                        needsRepair = true;
                        break;
                    }
                }

                if (needsRepair) {
                    console.log("Repairing broken V7 data...");
                    // Downgrade to V6 to force V6->V7 migration logic to run
                    // But wait, if it has V4 structure (from V1 fallback), we might need to downgrade to V4!
                    // Let's check for 'annualGoals' (V5+ feature).
                    const hasAnnualGoals = activeAreas.some(k => oldData.lifeAreas[k].goals?.annualGoals);
                    
                    let repairedState;
                    if (!hasAnnualGoals) {
                        // It's V4 structure masquerading as V7
                        repairedState = migrateData({ ...oldData, version: 4 });
                    } else {
                        // It's V6 structure (has annualGoals but missing dailyHistory)
                        repairedState = migrateData({ ...oldData, version: 6 });
                    }

                    // AUTO-ACTIVATE: If an area has goals/text but is inactive (due to wipe), activate it.
                    Object.keys(repairedState.lifeAreas).forEach(key => {
                        const area = repairedState.lifeAreas[key];
                        // Check if any goal text exists
                        const hasGoalText = 
                            area.goals.someday?.text || 
                            area.goals.fiveYear?.text ||
                            area.goals.annualGoals?.some(g => g.text) ||
                            area.goals.monthlyGoals?.some(g => g.text) ||
                            area.goals.weeklyGoals?.some(g => g.text) ||
                            area.goals.dailyHistory?.[Object.keys(area.goals.dailyHistory)[0]]?.text; // Check any daily history

                        if (hasGoalText && !area.active) {
                            area.active = true;
                        }
                    });

                    return repairedState;
                }
                
                return oldData;
            }

            // Version 6 → 7: Convert daily goal + completions to dailyHistory
            if (oldData.version === 6) {
                const newData = { ...oldData, version: 7 };
                const today = new Date().toISOString().split('T')[0];

                Object.keys(newData.lifeAreas).forEach(areaKey => {
                    const area = newData.lifeAreas[areaKey];
                    
                    // If dailyHistory already exists, skip (safety)
                    if (area.goals.dailyHistory) return;

                    const dailyHistory = {};

                    // 1. Migrate current daily goal to today
                    if (area.goals.daily && area.goals.daily.text) {
                        dailyHistory[today] = {
                            text: area.goals.daily.text,
                            completed: false, 
                            updatedAt: area.goals.daily.updatedAt || null
                        };
                    }

                    // 2. Migrate completions
                    if (area.completions && Array.isArray(area.completions)) {
                        area.completions.forEach(completion => {
                            if (!dailyHistory[completion.date]) {
                                dailyHistory[completion.date] = {
                                    text: completion.goal || "Completed Task",
                                    completed: true,
                                    updatedAt: null
                                };
                            } else {
                                dailyHistory[completion.date].completed = true;
                            }
                        });
                    }

                    // Assign new structure
                    area.goals.dailyHistory = dailyHistory;
                });
                return newData;
            }

            // Version 5 → 6: Add quarterly reviews array
            if (oldData.version === 5) {
                const v6Data = { ...oldData, version: 6 };

	        const normalizeForCompare = (value) => {
	            const seen = new WeakSet();
	
	            const normalize = (input) => {
	                if (input === null || input === undefined) return input;
	                const inputType = typeof input;
	                if (inputType === 'string' || inputType === 'number' || inputType === 'boolean') return input;
	
	                if (input && typeof input.toMillis === 'function') return { __type: 'timestamp', ms: input.toMillis() };
	                if (input instanceof Date) return { __type: 'date', iso: input.toISOString() };
	
	                if (Array.isArray(input)) return input.map(normalize);
	
	                if (inputType === 'object') {
	                    if (seen.has(input)) return { __type: 'cycle' };
	                    seen.add(input);
	
	                    const out = {};
	                    Object.keys(input).sort().forEach((key) => {
	                        out[key] = normalize(input[key]);
	                    });
	                    return out;
	                }
	
	                return String(input);
	            };
	
	            return normalize(value);
	        };

	        const firstDiffPath = (a, b) => {
	            const aN = normalizeForCompare(a);
	            const bN = normalizeForCompare(b);
	
	            const walk = (left, right, path) => {
	                if (left === right) return null;
	                if (left === null || right === null || left === undefined || right === undefined) return path;
	
	                const leftIsArray = Array.isArray(left);
	                const rightIsArray = Array.isArray(right);
	                if (leftIsArray !== rightIsArray) return path;
	
	                const leftType = typeof left;
	                const rightType = typeof right;
	                if (leftType !== rightType) return path;
	
	                if (leftType !== 'object') return path;
	
	                if (leftIsArray) {
	                    if (left.length !== right.length) return `${path}.length`;
	                    for (let i = 0; i < left.length; i++) {
	                        const diff = walk(left[i], right[i], `${path}[${i}]`);
	                        if (diff) return diff;
	                    }
	                    return null;
	                }
	
	                const leftKeys = Object.keys(left);
	                const rightKeys = Object.keys(right);
	                if (leftKeys.length !== rightKeys.length) return `${path}.__keys`;
	
	                for (const key of leftKeys) {
	                    if (!Object.prototype.hasOwnProperty.call(right, key)) return `${path}.${key}`;
	                    const diff = walk(left[key], right[key], path ? `${path}.${key}` : key);
	                    if (diff) return diff;
	                }
	                return null;
	            };
	
	            return walk(aN, bN, '');

        // ==========================================
        // AUTH SCREEN
        // ==========================================
        function AuthScreen() {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (mode === 'login') {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGoogleSignIn = async () => {
                setError('');
                setLoading(true);

                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
                    {/* Background Blobs */}
                    <div className="absolute top-0 left-0 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow"></div>
                    <div className="absolute bottom-0 right-0 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow animation-delay-2000"></div>

                    <div className="max-w-md w-full glass rounded-2xl p-8 relative z-10 animate-float">
                        <div className="text-center mb-10">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 mb-4 shadow-glow">
                                <span className="text-4xl font-bold text-white">1</span>
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">The ONE Thing</h1>
                            <p className="text-slate-400">Focus on what matters most</p>
                        </div>

                        {/* Google Sign-In Button */}
                        <button
                            onClick={handleGoogleSignIn}
                            disabled={loading}
                            className="w-full bg-white text-gray-800 py-3 rounded-xl font-semibold hover:bg-gray-100 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 flex items-center justify-center space-x-3 mb-6 shadow-lg"
                        >
                            <svg className="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            <span>{loading ? 'Connecting...' : 'Continue with Google'}</span>
                        </button>

                        <div className="relative my-8">
                            <div className="absolute inset-0 flex items-center">
                                <div className="w-full border-t border-slate-700"></div>
                            </div>
                            <div className="relative flex justify-center text-sm">
                                <span className="px-4 bg-slate-800 text-slate-400 rounded-full">Or continue with email</span>
                            </div>
                        </div>

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2 ml-1">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-600 transition-all"
                                    placeholder="you@example.com"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2 ml-1">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    minLength="6"
                                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white placeholder-slate-600 transition-all"
                                    placeholder="••••••••"
                                />
                            </div>

                            {error && (
                                <div className="bg-red-500/10 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl text-sm flex items-center">
                                    <span className="mr-2">⚠️</span> {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-xl font-bold hover:shadow-glow transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
                            >
                                {loading ? 'Processing...' : mode === 'login' ? 'Log In' : 'Sign Up'}
                            </button>
                        </form>

                        <div className="mt-8 text-center">
                            <button
                                onClick={() => setMode(mode === 'login' ? 'signup' : 'login')}
                                className="text-indigo-400 hover:text-indigo-300 text-sm font-medium transition-colors"
                            >
                                {mode === 'login' ? "Don't have an account? Sign Up" : 'Already have an account? Log In'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // REFLECTION & PLANNING
        // ==========================================
        function Reflection({ 
            lifeAreas, 
            activeAreas, 
            selectedLifeArea, 
            setSelectedLifeArea, 
            saveMonthlyReview, 
            getCurrentMonthReview, 
            saveQuarterlyReview, 
            getCurrentQuarterReview, 
            toggleLifeArea 
        }) {
            const [reflectionType, setReflectionType] = React.useState('monthly'); // 'monthly' or 'quarterly'

            return (
                <div className="space-y-8 fade-in">
                    {/* Reflection Type Toggle */}
                    <div className="flex justify-center">
                        <div className="glass p-1 rounded-2xl flex border border-slate-700/50">
                            <button
                                onClick={() => setReflectionType('monthly')}
                                className={`px-8 py-3 rounded-xl text-sm font-bold tracking-wider uppercase transition-all ${
                                    reflectionType === 'monthly'
                                        ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                Monthly
                            </button>
                            <button
                                onClick={() => setReflectionType('quarterly')}
                                className={`px-8 py-3 rounded-xl text-sm font-bold tracking-wider uppercase transition-all ${
                                    reflectionType === 'quarterly'
                                        ? 'bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-lg'
                                        : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                Quarterly
                            </button>
                        </div>
                    </div>

                    {reflectionType === 'monthly' ? (
                        <MonthlyReview
                            lifeAreas={lifeAreas}
                            activeAreas={activeAreas}
                            selectedLifeArea={selectedLifeArea}
                            setSelectedLifeArea={setSelectedLifeArea}
                            saveMonthlyReview={saveMonthlyReview}
                            getCurrentMonthReview={getCurrentMonthReview}
                            toggleLifeArea={toggleLifeArea}
                        />
                    ) : (
                        <QuarterlyReview
                            lifeAreas={lifeAreas}
                            activeAreas={activeAreas}
                            selectedLifeArea={selectedLifeArea}
                            setSelectedLifeArea={setSelectedLifeArea}
                            saveQuarterlyReview={saveQuarterlyReview}
                            getCurrentQuarterReview={getCurrentQuarterReview}
                            toggleLifeArea={toggleLifeArea}
                        />
                    )}
                </div>
            );
        }

        function MonthlyReview({ lifeAreas, activeAreas, selectedLifeArea, setSelectedLifeArea, saveMonthlyReview, getCurrentMonthReview, toggleLifeArea }) {
            const [formData, setFormData] = React.useState({
                accomplished: '',
                doDifferently: '',
                priorities: '',
                obstacles: ['', '', ''],
                solutions: ['', '', '']
            });
            const [showSaved, setShowSaved] = React.useState(false);

            const currentMonth = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long' });

            // Auto-load function
            React.useEffect(() => {
                if (selectedLifeArea) {
                    const existing = getCurrentMonthReview(selectedLifeArea);
                    if (existing) {
                        setFormData({
                            accomplished: existing.accomplished || '',
                            doDifferently: existing.doDifferently || '',
                            priorities: existing.priorities || '',
                            obstacles: existing.obstacles || ['', '', ''],
                            solutions: existing.solutions || ['', '', '']
                        });
                    } else {
                        setFormData({
                            accomplished: '',
                            doDifferently: '',
                            priorities: '',
                            obstacles: ['', '', ''],
                            solutions: ['', '', '']
                        });
                    }
                }
            }, [selectedLifeArea]);

            // Manual save function
            const handleSave = () => {
                if (!selectedLifeArea) return;
                saveMonthlyReview(selectedLifeArea, formData);
                setShowSaved(true);
                setTimeout(() => setShowSaved(false), 2000);
            };

            const updateObstacle = (index, value) => {
                const newObstacles = [...formData.obstacles];
                newObstacles[index] = value;
                setFormData({ ...formData, obstacles: newObstacles });
            };

            const updateSolution = (index, value) => {
                const newSolutions = [...formData.solutions];
                newSolutions[index] = value;
                setFormData({ ...formData, solutions: newSolutions });
            };

            return (
                <div className="space-y-8 fade-in">
                    {/* Header */}
                    <div className="glass rounded-2xl p-8 border-l-4 border-cyan-500">
                        <h2 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
                            Monthly Reflection
                        </h2>
                        <p className="text-slate-400 text-lg">Review your progress for {currentMonth}</p>
                    </div>

                    {/* Life Area Selector */}
                    <div className="glass rounded-2xl p-6 border border-slate-700/50">
                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 ml-1">Select Life Area</label>
                        {activeAreas.length === 0 ? (
                            <div className="text-center py-8">
                                <p className="text-slate-400 mb-6">No active life areas. Activate one to start reflecting.</p>

                                    {Object.keys(LIFE_AREAS).map(key => (
                                        <button
                                            key={key}
                                            onClick={() => toggleLifeArea(key)}
                                            className="px-4 py-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl border border-slate-700 hover:border-indigo-500/50 transition-all"
                                        >
                                            <span className="text-xl">{LIFE_AREAS[key].icon}</span>
                                            <span className="block text-sm text-slate-300 mt-1">{LIFE_AREAS[key].name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-wrap gap-3">
                                {activeAreas.map(areaKey => {
                                    const area = LIFE_AREAS[areaKey];
                                    const isSelected = selectedLifeArea === areaKey;
                                    return (
                                        <button
                                            key={areaKey}
                                            onClick={() => setSelectedLifeArea(areaKey)}
                                            className={`px-5 py-3 rounded-xl border transition-all transform hover:scale-105 ${
                                                isSelected
                                                    ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white border-transparent shadow-glow'
                                                    : 'bg-slate-800/50 text-slate-300 border-slate-700 hover:border-indigo-500/50'
                                            }`}
                                        >
                                            <span className="mr-2">{area.icon}</span>
                                            {area.name}
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {selectedLifeArea && (
                        <>
                            {/* Load/Save Controls */}
                            <div className="flex items-center gap-4">
                                <button
                                    onClick={handleSave}
                                    className="px-8 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-glow hover:shadow-cyan-500/40 transition-all transform hover:-translate-y-0.5"
                                >
                                    Save Reflection
                                </button>
                                {showSaved && (
                                    <div className="px-4 py-3 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center animate-pulse">
                                        <span className="mr-2">✓</span> Saved Successfully
                                    </div>
                                )}
                            </div>

                            {/* Review Questions */}
                            <div className="grid grid-cols-1 gap-6">
                                {/* Question 1 */}

                                    <label className="block text-lg font-medium text-cyan-300 mb-4 leading-relaxed">
                                        1. What's one thing you accomplished last month that made everything else easier or unnecessary?
                                    </label>
                                    <textarea
                                        value={formData.accomplished}
                                        onChange={(e) => setFormData({ ...formData, accomplished: e.target.value })}
                                        className="w-full px-5 py-4 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-lg leading-relaxed"
                                        rows="3"
                                        placeholder="Reflect on your biggest win..."
                                    />
                                </div>

                                {/* Question 2 */}
                                <div className="glass rounded-2xl p-8 border border-slate-700/50 hover:border-cyan-500/30 transition-colors">
                                    <label className="block text-lg font-medium text-cyan-300 mb-4 leading-relaxed">
                                        2. What's one thing you can do differently this month that will make everything else easier or unnecessary?
                                    </label>
                                    <textarea
                                        value={formData.doDifferently}
                                        onChange={(e) => setFormData({ ...formData, doDifferently: e.target.value })}

                                        rows="3"
                                        placeholder="What will you change this month?"
                                    />
                                </div>

                                {/* Question 3 */}

                                        value={formData.priorities}
                                        onChange={(e) => setFormData({ ...formData, priorities: e.target.value })}
                                        className="w-full px-5 py-4 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-lg leading-relaxed"
                                        rows="3"
                                        placeholder="List your key priorities..."
                                    />
                                </div>

                                {/* Question 4 & 5 - Obstacles and Solutions */}

                        q2: existing.q2 || '',
                        q3: existing.q3 || '',

        // ==========================================
        function Dashboard({ lifeAreas, activeAreas, updateGoal, completeDaily, quote, rotateQuote, toggleLifeArea }) {
            // Helper to get local date string YYYY-MM-DD
            const getLocalDateString = (dateObj = new Date()) => {
                const d = new Date(dateObj);
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const [selectedDate, setSelectedDate] = React.useState(getLocalDateString());
            const today = getLocalDateString();

            const changeDate = (days) => {
                const [y, m, d] = selectedDate.split('-').map(Number);
                const date = new Date(Date.UTC(y, m - 1, d));
                date.setUTCDate(date.getUTCDate() + days);
                const newY = date.getUTCFullYear();
                const newM = String(date.getUTCMonth() + 1).padStart(2, '0');
                const newD = String(date.getUTCDate()).padStart(2, '0');
                setSelectedDate(`${newY}-${newM}-${newD}`);
            };

            const formatDateDisplay = (dateStr) => {
                const [y, m, d] = dateStr.split('-').map(Number);
                const date = new Date(y, m - 1, d); 
                return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            };

            const isToday = selectedDate === today;

            return (
                <div className="space-y-8 fade-in">
                    {/* Quote Section */}
                    <div className="relative group perspective-1000">
                        <div className="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                        <div className="relative glass rounded-2xl p-8 transform transition-transform duration-500 hover:rotate-x-2">
                            <div className="flex items-start justify-between">
                                <div className="flex-1">
                                    <p className="text-2xl font-light leading-relaxed italic text-white/90 drop-shadow-sm font-serif">
                                        "{quote}"
                                    </p>
                                </div>
                                <button
                                    onClick={rotateQuote}
                                    className="ml-4 p-2 rounded-full hover:bg-white/10 text-white/50 hover:text-white transition-all transform hover:rotate-180 duration-500"
                                    title="Next quote"
                                >
                                    ↻
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Date Navigation HUD */}
                    <div className="glass rounded-2xl p-4 border border-slate-700/50 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => changeDate(-1)}
                                className="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-all border border-slate-700"
                                title="Previous Day"
                            >
                                ←
                            </button>
                            <button 
                                onClick={() => setSelectedDate(today)}

                                    value={todayEntry.text}

        // ==========================================
        // TIME BLOCKING
        // ==========================================
        function TimeBlocking({ lifeAreas, activeAreas, timeBlocks, addTimeBlock, updateTimeBlock, deleteTimeBlock }) {
            // Helper to get local date string YYYY-MM-DD
            const getLocalDateString = () => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const [selectedDate, setSelectedDate] = useState(getLocalDateString());
            const [newBlock, setNewBlock] = useState({
                startTime: '09:00',
                duration: 4,
                task: '',
                lifeArea: activeAreas[0] || 'business'
            });

            const handleAddBlock = () => {
                if (!newBlock.task) {
                    alert('Please enter a task for this time block');
                    return;
                }

                // Create correct start/end times preserving the selected date
                // Append T to ensure it is treated as local iso time
                const start = new Date(`${selectedDate}T${newBlock.startTime}`);
                const end = new Date(start.getTime() + newBlock.duration * 60 * 60 * 1000);

                addTimeBlock({
                    date: selectedDate,
                    startTime: newBlock.startTime,
                    endTime: end.toTimeString().slice(0, 5),
                    task: newBlock.task,
                    lifeArea: newBlock.lifeArea,
                    completed: false
                });

                setNewBlock({ startTime: '09:00', duration: 4, task: '', lifeArea: newBlock.lifeArea });
            };

            const todayBlocks = timeBlocks.filter(block => block.date === selectedDate);

            // Helper to parsing YYYY-MM-DD as local date for display
            const formatDisplayDate = (dateStr) => {
                const [y, m, d] = dateStr.split('-').map(Number);
                const date = new Date(y, m - 1, d); // Month is 0-indexed
                return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            };

            return (
                <div className="space-y-8 fade-in text-white">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-600/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">⏰</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Time Blocking</h2>
                        <p className="text-slate-400 text-lg">
                            Dedicate uninterrupted time blocks to your ONE Thing
                        </p>
                    </div>

                    <div className="glass rounded-2xl p-6 border border-blue-500/30 bg-blue-500/5">
                        <h3 className="font-bold text-blue-300 mb-2 flex items-center">
                            <span className="mr-2">⚡️</span> The Power of Time Blocking
                        </h3>
                        <p className="text-blue-100/80 text-sm leading-relaxed">
                            Protect time for your ONE Thing by blocking off dedicated chunks. The recommended duration is 4 hours -
                            this ensures you have the uninterrupted focus needed for extraordinary results.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="md:col-span-1 space-y-6">
                            <div className="glass rounded-2xl p-6 border border-slate-700/50">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">
                                    Select Date
                                </label>
                                <input
                                    type="date"
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-900/60 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-white transition-all text-sm"
                                />
                            </div>

                            <div className="glass rounded-2xl p-6 border border-slate-700/50">
                                <h3 className="text-lg font-bold text-white mb-5 flex items-center">
                                    <span className="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center mr-3 text-indigo-400">+</span>
                                    Add Block
                                </h3>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                            Life Area
                                        </label>
                                        <select
                                            value={newBlock.lifeArea}
                                            onChange={(e) => setNewBlock({ ...newBlock, lifeArea: e.target.value })}
                                            className="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm"
                                        >
                                            {activeAreas.map(areaKey => (
                                                <option key={areaKey} value={areaKey}>
                                                    {LIFE_AREAS[areaKey].icon} {LIFE_AREAS[areaKey].name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                                Start
                                            </label>
                                            <input
                                                type="time"
                                                value={newBlock.startTime}
                                                onChange={(e) => setNewBlock({ ...newBlock, startTime: e.target.value })}
                                                className="w-full px-3 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                                Hours
                                            </label>
                                            <select
                                                value={newBlock.duration}
                                                onChange={(e) => setNewBlock({ ...newBlock, duration: Number(e.target.value) })}
                                                className="w-full px-3 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm"
                                            >
                                                {[1, 2, 3, 4, 5, 6, 7, 8].map(h => (
                                                    <option key={h} value={h}>{h} hr{h > 1 ? 's' : ''}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                                            Task (The ONE Thing)
                                        </label>
                                        <input
                                            type="text"
                                            value={newBlock.task}
                                            onChange={(e) => setNewBlock({ ...newBlock, task: e.target.value })}
                                            placeholder="What will you focus on?"
                                            className="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-500 text-white text-sm placeholder-slate-500"
                                        />
                                    </div>

                                    {activeAreas.length > 0 && (
                                        <div className="pt-2">
                                            <span className="text-xs text-slate-500 mb-2 block ml-1">Quick fill from goals:</span>
                                            <div className="flex flex-wrap gap-2">
                                                {activeAreas.map(areaKey => {
                                                    const dailyGoal = lifeAreas[areaKey].goals.daily.text;
                                                    if (dailyGoal) {
                                                        return (
                                                            <button
                                                                key={areaKey}
                                                                onClick={() => setNewBlock({ ...newBlock, task: dailyGoal, lifeArea: areaKey })}
                                                                className="text-xs px-2 py-1 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded text-slate-300 truncate max-w-full transition-colors flex items-center"
                                                                title={dailyGoal}
                                                            >
                                                                <span className="mr-1">{LIFE_AREAS[areaKey].icon}</span>
                                                                {dailyGoal.substring(0, 15)}{dailyGoal.length > 15 ? '...' : ''}
                                                            </button>
                                                        );
                                                    }
                                                    return null;
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <button
                                        onClick={handleAddBlock}
                                        className="w-full px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-indigo-500/30 mt-2"
                                    >
                                        Schedule Block
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="md:col-span-2">
                            <div className="glass rounded-2xl p-6 border border-slate-700/50 min-h-[500px]">
                                <h3 className="text-xl font-bold text-white mb-6 flex items-center justify-between">
                                    <span>Schedule &nbsp;<span className="text-slate-500 font-normal text-base">
                                        {formatDisplayDate(selectedDate)}
                                    </span></span>
                                    {todayBlocks.length > 0 && <span className="text-xs font-normal px-2 py-1 bg-slate-800 rounded-lg text-slate-400">{todayBlocks.length} blocks</span>}
                                </h3>

                                {todayBlocks.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-64 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
                                        <span className="text-4xl mb-3 opacity-50">📅</span>
                                        <p className="text-center">No time blocks scheduled for this day.</p>
                                        <p className="text-sm opacity-60">"If it's not on your calendar, it doesn't exist."</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {todayBlocks.sort((a, b) => a.startTime.localeCompare(b.startTime)).map(block => {
                                            const areaInfo = LIFE_AREAS[block.lifeArea] || LIFE_AREAS.business;
                                            return (
                                                <div
                                                    key={block.id}
                                                    className={`time-block p-5 rounded-xl border transition-all duration-300 group ${block.completed
                                                        ? 'bg-slate-900/40 border-slate-800 opacity-60'
                                                        : 'glass hover:bg-white/5 border-slate-600/50 hover:border-slate-500 hover:shadow-lg hover:shadow-indigo-500/10'
                                                        }`}
                                                >
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex-1">
                                                            <div className="flex items-start space-x-4">
                                                                <div className="mt-1">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={block.completed}
                                                                        onChange={(e) => updateTimeBlock(block.id, { completed: e.target.checked })}
                                                                        className="w-6 h-6 text-emerald-500 rounded-md focus:ring-emerald-500 focus:ring-offset-slate-900 bg-slate-700 border-slate-500 cursor-pointer transition-all"
                                                                    />
                                                                </div>
                                                                <div className="flex-1">
                                                                    <div className="flex items-center gap-2 mb-1">
                                                                        <span className="text-sm px-2 py-0.5 bg-slate-800/80 text-slate-300 rounded text-xs font-mono border border-slate-700">
                                                                            {block.startTime} - {block.endTime}
                                                                        </span>
                                                                        <span className={`text-xs px-2 py-0.5 rounded-full flex items-center gap-1 border border-slate-700 bg-${areaInfo.color}-500/10 text-${areaInfo.color}-300`}>
                                                                            {areaInfo.icon} {areaInfo.name}
                                                                        </span>
                                                                    </div>
                                                                    <p className={`text-lg font-medium transition-all ${block.completed ? 'line-through text-slate-500' : 'text-white'}`}>
                                                                        {block.task}
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button
                                                            onClick={() => deleteTimeBlock(block.id)}
                                                            className="text-slate-600 hover:text-red-400 p-2 rounded-lg hover:bg-red-500/10 transition-colors opacity-0 group-hover:opacity-100"
                                                            title="Delete Block"
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // PROGRESS TRACKER
        // ==========================================
        function ProgressTracker({ lifeAreas, activeAreas }) {
            // Helper to get local date string YYYY-MM-DD
            const getLocalDateString = (dateObj = new Date()) => {
                const offset = dateObj.getTimezoneOffset() * 60000;
                return new Date(dateObj.getTime() - offset).toISOString().split('T')[0];
            };

            // Aggregate completions from all active life areas
            const allCompletions = [];
            Object.keys(lifeAreas).forEach(areaKey => {
                if (lifeAreas[areaKey].active) {
                    lifeAreas[areaKey].completions.forEach(comp => {
                        allCompletions.push({
                            ...comp,
                            lifeArea: areaKey
                        });
                    });
                }
            });

            // Use local date for 'today'
            const todayStr = getLocalDateString();

            const last30Days = Array.from({ length: 30 }, (_, i) => {
                const date = new Date();
                date.setDate(date.getDate() - (29 - i));
                return getLocalDateString(date);
            });

            const completionMap = allCompletions.reduce((acc, comp) => {
                acc[comp.date] = true;
                return acc;
            }, {});

            const completedDays = last30Days.filter(date => completionMap[date]).length;
            const completionRate = Math.round((completedDays / 30) * 100);

            let currentStreak = 0;
            for (let i = 0; i < 30; i++) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = getLocalDateString(date);
                if (completionMap[dateStr]) {
                    currentStreak++;
                } else {
                    break;
                }
            }

            return (
                <div className="space-y-8 fade-in text-white">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-green-500/20 to-emerald-600/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">📈</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Progress & Statistics</h2>
                        <p className="text-slate-400 text-lg">
                            Track your consistency and celebrate your wins
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass rounded-2xl p-6 border border-blue-500/30 bg-blue-500/5 text-center group hover:bg-blue-500/10 transition-colors">
                            <div className="text-5xl font-bold text-blue-400 mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(96,165,250,0.5)]">
                                {currentStreak}
                            </div>
                            <div className="text-blue-200 font-bold uppercase tracking-wider text-sm">Day Streak</div>
                            <div className="text-blue-300/60 text-xs mt-1">Current consecutive days</div>
                        </div>

                        <div className="glass rounded-2xl p-6 border border-emerald-500/30 bg-emerald-500/5 text-center group hover:bg-emerald-500/10 transition-colors">
                            <div className="text-5xl font-bold text-emerald-400 mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(52,211,153,0.5)]">
                                {completedDays}
                            </div>
                            <div className="text-emerald-200 font-bold uppercase tracking-wider text-sm">Completed Days</div>
                            <div className="text-emerald-300/60 text-xs mt-1">Last 30 days</div>
                        </div>

                        <div className="glass rounded-2xl p-6 border border-purple-500/30 bg-purple-500/5 text-center group hover:bg-purple-500/10 transition-colors">
                            <div className="text-5xl font-bold text-purple-400 mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(167,139,250,0.5)]">
                                {completionRate}%
                            </div>
                            <div className="text-purple-200 font-bold uppercase tracking-wider text-sm">Completion Rate</div>
                            <div className="text-purple-300/60 text-xs mt-1">Last 30 days</div>
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center">
                            Last 30 Days
                        </h3>
                        <div className="grid grid-cols-10 gap-3">
                            {last30Days.map((date, i) => {
                                const isCompleted = completionMap[date];
                                const [y, m, d] = date.split('-').map(Number);
                                const dateObj = new Date(y, m - 1, d);
                                const isToday = date === todayStr;

                                return (
                                    <div
                                        key={date}
                                        className={`aspect-square rounded-lg flex flex-col items-center justify-center text-xs transition-all duration-300 relative group cursor-default ${isCompleted
                                            ? 'bg-emerald-500 text-white shadow-[0_0_10px_rgba(16,185,129,0.5)] scale-105 z-10'
                                            : isToday
                                                ? 'bg-slate-800 border-2 border-indigo-500 text-indigo-400 shadow-[0_0_10px_rgba(99,102,241,0.3)]'
                                                : 'bg-slate-800/50 text-slate-600 hover:bg-slate-800 hover:text-slate-400'
                                            }`}
                                        title={dateObj.toLocaleDateString()}
                                        style={{ transitionDelay: `${i * 10}ms` }}
                                    >
                                        <div className="font-bold">{dateObj.getDate()}</div>
                                        {isCompleted && (
                                            <div className="absolute inset-0 bg-emerald-400 rounded-lg blur opacity-20"></div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50 min-h-[400px]">
                        <h3 className="text-xl font-bold text-white mb-6">Recent Completions</h3>
                        {allCompletions.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-64 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
                                <span className="text-4xl mb-3 opacity-50">🏆</span>
                                <p className="text-center">No completions yet.</p>
                                <p className="text-sm opacity-60">Start by setting and completing your daily ONE Thing!</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {allCompletions
                                    .slice()
                                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                                    .slice(0, 10)
                                    .map((completion, index) => {
                                        const areaInfo = LIFE_AREAS[completion.lifeArea];
                                        const [y, m, d] = completion.date.split('-').map(Number);
                                        const dateObj = new Date(y, m - 1, d);
                                        return (
                                            <div
                                                key={index}
                                                className="flex items-center space-x-4 p-4 rounded-xl border border-slate-700/50 bg-slate-800/30 hover:bg-slate-800/50 transition-all hover:scale-[1.01] group"
                                            >
                                                <div className="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500 border border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.1)] group-hover:shadow-[0_0_15px_rgba(16,185,129,0.2)] transition-all">
                                                    ✓
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-lg filter drop-shadow">{areaInfo.icon}</span>
                                                        <span className={`text-xs px-2 py-0.5 rounded-full border border-slate-700 bg-${areaInfo.color}-500/10 text-${areaInfo.color}-300 font-mono uppercase tracking-wide`}>
                                                            {areaInfo.name}
                                                        </span>
                                                    </div>
                                                    <p className="font-medium text-white group-hover:text-indigo-200 transition-colors">{completion.goal}</p>
                                                    <p className="text-xs text-slate-500 mt-1">
                                                        {dateObj.toLocaleDateString('en-US', {
                                                            weekday: 'long',
                                                            year: 'numeric',
                                                            month: 'long',
                                                            day: 'numeric'
                                                        })}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                                        hover:file:bg-purple-500
                                        cursor-pointer file:cursor-pointer file:transition-colors file:shadow-lg file:shadow-purple-500/30"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50 text-center">
                        <h3 className="text-xl font-bold text-white mb-4">About</h3>
                        <p className="text-slate-400 mb-6 max-w-2xl mx-auto leading-relaxed">
                            This app is based on "The ONE Thing" by Gary Keller and Jay Papasan.
                            It helps you identify and focus on the single most important task that
                            will make everything else easier or unnecessary.
                        </p>
                        <p className="text-xs text-slate-600 font-mono">
                            {user ?
                                'Your data is securely stored in the cloud and synced across all your devices.' :
                                'All data is stored locally in your browser. No information is sent to any server.'
                            }
                        </p>
                    </div>
                </div>
            );
        }

        // Render the app
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
                console.error("Uncaught error:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white p-8">
                            <div className="max-w-3xl mx-auto glass rounded-2xl p-8 border border-red-500/50">
                                <h1 className="text-2xl font-bold text-red-400 mb-4">Something went wrong.</h1>
                                <p className="text-slate-300 mb-4">Please report this error:</p>
                                <pre className="bg-slate-950 p-4 rounded-xl overflow-auto text-xs font-mono text-red-200 mb-4">
                                    {this.state.error && this.state.error.toString()}
                                </pre>
                                <pre className="bg-slate-950 p-4 rounded-xl overflow-auto text-xs font-mono text-slate-500">
                                    {this.state.errorInfo && this.state.errorInfo.componentStack}
                                </pre>
                                <button 
                                    onClick={() => window.location.reload()}
                                    className="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all"
                                >
                                    Reload Page
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children; 
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
