            pointer-events: none;
            opacity: 0.4;

            left: 0;

            position: relative;

            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
            transition: all 0.3s ease;
            opacity: 0.5;

            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }

        .hud-card::after {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;

            border-color: var(--neon-cyan);
            background: rgba(6, 182, 212, 0.1);

            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(6, 182, 212, 0.1) 50%, rgba(0, 0, 0, 0) 100%);

            position: absolute;
            bottom: 100%;

            0% {

            }

            }

            }

            -webkit-background-clip: text;

            border: 3px solid rgba(6, 182, 212, 0.1);
            border-left-color: var(--neon-cyan);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>

        const createEmptyGoals = () => ({
            someday: { text: '', updatedAt: null },
            fiveYear: { text: '', updatedAt: null },
            // Annual (1-Year) - up to 5 goals in priority order
            annualGoals: [
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },

            ],
            annualOneThingIndex: 0, // Which of the 5 is THE ONE (0-4)
            // Monthly - up to 5 goals in priority order
            monthlyGoals: [

                { text: '', updatedAt: null },

                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null },
                { text: '', updatedAt: null }
            ],
            weeklyOneThingIndex: 0, // Which of the 5 is THE ONE (0-4)
            // Daily History - Keyed by YYYY-MM-DD
            dailyHistory: {} 
        });

	        const getInitialState = () => ({
	            version: 7, // Track data version for migrations (v7 = daily history)
	            _meta: {
	                clientId: getClientId(),
	                updatedAt: null
	            },
	            lifeAreas: Object.keys(LIFE_AREAS).reduce((acc, key) => {
	                acc[key] = {
	                    active: key === 'business', // Default Business to active to prevent lockout
	                    goals: createEmptyGoals(),
	                    completions: [], // Deprecated in v7, kept for safety during migration
	                    obstaclesSolutions: [],
	                    obstacleWeeklyFocus: null,
	                    reviews: {
	                        monthly: [],
	                        quarterly: []
	                    }
	                };
	                return acc;
	            }, {}),
	            dayNotes: {},
	            timeBlocks: [],
	            currentQuoteIndex: 0,
	            // 4-1-1 System tracking
	            lastWeeklyReview: null,  // ISO date of last weekly review
            lastAnnualReview: null   // ISO date of last annual review
        });

	        // Migrate old data format to new multi-goal format
	        const migrateData = (oldData) => {
	            if (!oldData || typeof oldData !== 'object') {
	                return getInitialState();
	            }
	
	            const parsedVersion = Number.parseInt(oldData.version, 10);
	            const version = Number.isFinite(parsedVersion) ? parsedVersion : 1;
	
	            // REPAIR: Check for broken V7 data (V7 flag but V4/V6 structure)
	            // This happens if V1 fallback returned V7 state with V4 structure
	            if (version === 7) {
	                let needsRepair = false;
	                const activeAreas = Object.keys(oldData.lifeAreas || {});
                
                // Check if any area has 'daily' goal but no 'dailyHistory'
                for (const key of activeAreas) {
                    const goals = oldData.lifeAreas[key].goals;
                    if (goals && goals.daily && !goals.dailyHistory) {
                        needsRepair = true;
                        break;
                    }
                }

                if (needsRepair) {
                    console.log("Repairing broken V7 data...");
                    // Downgrade to V6 to force V6->V7 migration logic to run
                    // But wait, if it has V4 structure (from V1 fallback), we might need to downgrade to V4!
                    // Let's check for 'annualGoals' (V5+ feature).
                    const hasAnnualGoals = activeAreas.some(k => oldData.lifeAreas[k].goals?.annualGoals);
                    
                    let repairedState;
                    if (!hasAnnualGoals) {
                        // It's V4 structure masquerading as V7
                        repairedState = migrateData({ ...oldData, version: 4 });
                    } else {
                        // It's V6 structure (has annualGoals but missing dailyHistory)
                        repairedState = migrateData({ ...oldData, version: 6 });
                    }

                    // AUTO-ACTIVATE: If an area has goals/text but is inactive (due to wipe), activate it.
                    Object.keys(repairedState.lifeAreas).forEach(key => {
                        const area = repairedState.lifeAreas[key];
                        // Check if any goal text exists
                        const hasGoalText = 
                            area.goals.someday?.text || 
                            area.goals.fiveYear?.text ||
                            area.goals.annualGoals?.some(g => g.text) ||
                            area.goals.monthlyGoals?.some(g => g.text) ||
                            area.goals.weeklyGoals?.some(g => g.text) ||
                            area.goals.dailyHistory?.[Object.keys(area.goals.dailyHistory)[0]]?.text; // Check any daily history

                        if (hasGoalText && !area.active) {
                            area.active = true;
                        }
                    });

                    return repairedState;
                }
                
	                // Normalize version type (Firestore can store it as a string).
	                if (oldData.version !== 7) return { ...oldData, version: 7 };
	                return oldData;
	            }
	
	            // Version 6 → 7: Convert daily goal + completions to dailyHistory
	            if (version === 6) {
	                const newData = { ...oldData, version: 7 };
	                const today = new Date().toISOString().split('T')[0];

                Object.keys(newData.lifeAreas).forEach(areaKey => {
                    const area = newData.lifeAreas[areaKey];
                    
                    // If dailyHistory already exists, skip (safety)
                    if (area.goals.dailyHistory) return;

                    const dailyHistory = {};

		                const dataStr = JSON.stringify(state, null, 2);
		                const dataBlob = new Blob([dataStr], { type: 'application/json' });
		                const url = URL.createObjectURL(dataBlob);
		                const link = document.createElement('a');
		                link.href = url;
		                link.download = `one-thing-backup-${getLocalDateString()}.json`;
		                link.click();
		                URL.revokeObjectURL(url);
		            };

            // Import data
		            const importData = (file) => {
		                const reader = new FileReader();
		                reader.onload = (e) => {
		                    try {
		                        const imported = JSON.parse(e.target.result);
		                        saveState(imported);
		                        alert('Data imported successfully!');
		                    } catch (err) {
		                        alert('Error importing data. Please check the file format.');
		                    }
		                };
		                reader.readAsText(file);
		            };

		            const storageInfo = React.useMemo(() => {
		                const safeByteCount = (str) => {
		                    try {
		                        return new Blob([String(str)]).size;
		                    } catch {
		                        return String(str).length;
		                    }
		                };

		                const stateStr = (() => {
		                    try {
		                        return JSON.stringify(state);
		                    } catch {
		                        return '';
		                    }
		                })();
		                const stateBytes = safeByteCount(stateStr);

		                const localKeys = [
		                    'oneThingApp',
		                    'oneThingClientId',
		                    'oneThingAutosaveDaily',
		                    'oneThingDismissedReviewReminders'
		                ];
		                const localBytesByKey = {};
		                let localTotalBytes = 0;
		                localKeys.forEach((k) => {
		                    try {
		                        const v = localStorage.getItem(k);
		                        const bytes = v ? safeByteCount(v) : 0;
		                        localBytesByKey[k] = bytes;
		                        localTotalBytes += bytes;
		                    } catch {
		                        localBytesByKey[k] = 0;
		                    }
		                });

		                // Browser quotas vary; use a conservative 5MB baseline for warning purposes.
		                const quotaBytes = 5 * 1024 * 1024;
		                const pct = quotaBytes ? Math.min(100, Math.round((localTotalBytes / quotaBytes) * 100)) : 0;
		                const warn = localTotalBytes >= quotaBytes * 0.8;

		                const fmt = (bytes) => {
		                    if (!Number.isFinite(bytes)) return '—';
		                    if (bytes < 1024) return `${bytes} B`;
		                    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
		                    return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
		                };

		                return {
		                    stateBytes,
		                    localTotalBytes,
		                    localBytesByKey,
		                    quotaBytes,
		                    pct,
		                    warn,
		                    fmt
		                };
		            }, [state]);

		            const archiveOldHistory = (months = 6) => {
		                const monthsNum = Number(months);
		                if (!Number.isFinite(monthsNum) || monthsNum <= 0) return;

		                const now = new Date();
		                const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate());
		                cutoff.setMonth(cutoff.getMonth() - monthsNum);

		                const cutoffStr = getLocalDateString(cutoff);

		                const dateLt = (a, b) => {
		                    // Compare YYYY-MM-DD lexicographically
		                    return String(a) < String(b);
		                };

		                const nextLifeAreas = { ...state.lifeAreas };
		                let removedDailyEntries = 0;
		                Object.keys(nextLifeAreas).forEach((areaKey) => {
		                    const area = nextLifeAreas[areaKey];
		                    if (!area || !area.goals || !area.goals.dailyHistory) return;
		                    const dailyHistory = area.goals.dailyHistory;
		                    const nextDailyHistory = {};
		                    Object.keys(dailyHistory).forEach((dateKey) => {
		                        if (dateKey && dateLt(dateKey, cutoffStr)) {
		                            removedDailyEntries += 1;
		                            return;
		                        }
		                        nextDailyHistory[dateKey] = dailyHistory[dateKey];
		                    });
		                    nextLifeAreas[areaKey] = {
		                        ...area,
		                        goals: {
		                            ...area.goals,
		                            dailyHistory: nextDailyHistory
		                        }
		                    };
		                });

		                const nextDayNotes = {};
		                let removedDayNotes = 0;
		                Object.keys(state.dayNotes || {}).forEach((dateKey) => {
		                    if (dateKey && dateLt(dateKey, cutoffStr)) {
		                        removedDayNotes += 1;
		                        return;
		                    }
		                    nextDayNotes[dateKey] = state.dayNotes[dateKey];
		                });

		                const nextTimeBlocks = Array.isArray(state.timeBlocks)
		                    ? state.timeBlocks.filter((b) => !(b && b.date && dateLt(b.date, cutoffStr)))
		                    : [];
		                const removedTimeBlocks = Array.isArray(state.timeBlocks) ? (state.timeBlocks.length - nextTimeBlocks.length) : 0;

		                const summary =
		                    `This will archive history older than ${monthsNum} month(s) (before ${cutoffStr}).\n\n` +
		                    `Removes:\n` +
		                    `- Daily history entries: ${removedDailyEntries}\n` +
		                    `- Day notes: ${removedDayNotes}\n` +
		                    `- Time blocks: ${removedTimeBlocks}\n\n` +

		                const shouldExport = window.confirm(`Recommended: export a backup before archiving.\n\nClick OK to export now, or Cancel to continue.`);

		                const ok = window.confirm(summary);

        // ==========================================
