	        // ==========================================
	        // PROGRESS TRACKER
	        // ==========================================
	        function ProgressTracker({ lifeAreas, activeAreas, dayNotes = {}, setDayNote, setDailyGoalsForDate }) {
		            const [selectedAreaScope, setSelectedAreaScope] = React.useState('all'); // 'all' or areaKey
		            const [rangeDays, setRangeDays] = React.useState(30); // 7 / 30 / 90
		            const [viewMode, setViewMode] = React.useState('month'); // month | range
	            const [monthCursor, setMonthCursor] = React.useState(() => {
	                const d = new Date();
	                const y = d.getFullYear();
	                const m = String(d.getMonth() + 1).padStart(2, '0');
	                return `${y}-${m}`;
	            });
		            const [openDay, setOpenDay] = React.useState(null);
		            const [noteDraft, setNoteDraft] = React.useState('');
		            const [dailyGoalAreasDraft, setDailyGoalAreasDraft] = React.useState([]); // list of areaKeys shown in modal
		            const [dailyGoalTextDrafts, setDailyGoalTextDrafts] = React.useState({}); // areaKey -> text
		            const [dailyGoalsSaved, setDailyGoalsSaved] = React.useState(false);

	            // Helper to get local date string YYYY-MM-DD
	            const getLocalDateString = (dateObj = new Date()) => {
	                const offset = dateObj.getTimezoneOffset() * 60000;
	                return new Date(dateObj.getTime() - offset).toISOString().split('T')[0];
	            };

		            React.useEffect(() => {
		                if (!openDay) return;
		                const existing = dayNotes && dayNotes[openDay] ? dayNotes[openDay].text : '';
		                setNoteDraft(existing || '');
		            }, [openDay, dayNotes]);

		            React.useEffect(() => {
		                if (!openDay) return;
		                const existingGoalsAreas = Object.keys(LIFE_AREAS).filter((areaKey) => {
		                    const t = lifeAreas && lifeAreas[areaKey] && lifeAreas[areaKey].goals && lifeAreas[areaKey].goals.dailyHistory && lifeAreas[areaKey].goals.dailyHistory[openDay]
		                        ? (lifeAreas[areaKey].goals.dailyHistory[openDay].text || '')
		                        : '';
		                    return String(t || '').trim().length > 0;
		                });

		                const baseAreas = selectedAreaScope === 'all'
		                    ? (Array.isArray(activeAreas) ? activeAreas.slice() : [])
		                    : [selectedAreaScope];

		                const merged = Array.from(new Set([...(baseAreas || []), ...(existingGoalsAreas || [])]))
		                    .filter((k) => Boolean(LIFE_AREAS[k]));

		                const drafts = {};
		                merged.forEach((areaKey) => {
		                    const t = lifeAreas && lifeAreas[areaKey] && lifeAreas[areaKey].goals && lifeAreas[areaKey].goals.dailyHistory && lifeAreas[areaKey].goals.dailyHistory[openDay]
		                        ? (lifeAreas[areaKey].goals.dailyHistory[openDay].text || '')
		                        : '';
		                    drafts[areaKey] = String(t || '');
		                });

		                setDailyGoalAreasDraft(merged);
		                setDailyGoalTextDrafts(drafts);
		                setDailyGoalsSaved(false);
		            }, [openDay, selectedAreaScope, activeAreas, lifeAreas]);

	            React.useEffect(() => {
	                if (selectedAreaScope === 'all') return;
	                if (!activeAreas.includes(selectedAreaScope)) setSelectedAreaScope('all');
	            }, [selectedAreaScope, activeAreas]);

            const parseLocalDate = (dateStr) => {
                const [y, m, d] = String(dateStr).split('-').map(Number);
                return new Date(y, (m || 1) - 1, d || 1);
            };

            // Aggregate completions from all active life areas
            const allCompletionsAllActive = [];
		            Object.keys(lifeAreas).forEach(areaKey => {
		                if (lifeAreas[areaKey].active) {
		                    const area = lifeAreas[areaKey];
		                    
		                    // v7 source of truth: dailyHistory
		                    const dailyHistory = area.goals && area.goals.dailyHistory ? area.goals.dailyHistory : {};
		                    const completedDatesFromHistory = new Set();
		                    Object.keys(dailyHistory).forEach(date => {
		                        const entry = dailyHistory[date];
		                        if (entry && entry.completed) {
		                            completedDatesFromHistory.add(date);
		                            allCompletionsAllActive.push({
		                                date,
		                                goal: entry.text || 'Completed Task',
		                                lifeArea: areaKey
		                            });
		                        }
		                    });
		                    
		                    // legacy fallback: completions array (kept for older migrated data)
		                    if (Array.isArray(area.completions)) {
		                        area.completions.forEach(comp => {
		                            if (comp && comp.date && completedDatesFromHistory.has(comp.date)) return;
		                            allCompletionsAllActive.push({
		                                ...comp,
		                                lifeArea: areaKey
		                            });
		                        });
		                    }
		                }
		            });

            // Use local date for 'today'
            const todayStr = getLocalDateString();

            const lastNDays = Array.from({ length: rangeDays }, (_, i) => {
                const date = new Date();
                date.setDate(date.getDate() - ((rangeDays - 1) - i));
                return getLocalDateString(date);
            });

            const startDate = (() => {
                const d = new Date();
                d.setHours(0, 0, 0, 0);
                d.setDate(d.getDate() - (rangeDays - 1));
                return d;
            })();

	            const filteredCompletions = allCompletionsAllActive.filter((comp) => {
	                if (!comp || !comp.date) return false;
	                if (selectedAreaScope !== 'all' && comp.lifeArea !== selectedAreaScope) return false;
	                const d = parseLocalDate(comp.date);
	                d.setHours(0, 0, 0, 0);
	                return d >= startDate;
	            });

	            const scopedCompletionsAllTime = allCompletionsAllActive.filter((comp) => {
	                if (!comp || !comp.date) return false;
	                if (selectedAreaScope !== 'all' && comp.lifeArea !== selectedAreaScope) return false;
	                return true;
	            });

	            const monthCompletions = scopedCompletionsAllTime.filter((comp) => String(comp.date).startsWith(monthCursor));
	            const monthCompletionByDate = monthCompletions.reduce((acc, comp) => {
	                const key = comp.date;
	                if (!acc[key]) acc[key] = [];
	                acc[key].push(comp);
	                return acc;
	            }, {});

	            const completionMap = filteredCompletions.reduce((acc, comp) => {
	                acc[comp.date] = true;
	                return acc;
	            }, {});

	            const monthCompletionMap = monthCompletions.reduce((acc, comp) => {
	                acc[comp.date] = true;
	                return acc;
	            }, {});

            const completedDays = lastNDays.filter(date => completionMap[date]).length;
	            const completionRate = Math.round((completedDays / rangeDays) * 100);

            let currentStreak = 0;
            for (let i = 0; i < rangeDays; i++) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = getLocalDateString(date);
                if (completionMap[dateStr]) {
                    currentStreak++;
                } else {
                    break;
                }
            }

	            const buildSparklinePoints = (values, width = 140, height = 28, pad = 3) => {
	                const safe = Array.isArray(values) ? values : [];
	                if (safe.length <= 1) return '';
	                const maxV = Math.max(1, ...safe);
	                const minV = Math.min(0, ...safe);
	                const range = Math.max(1e-6, maxV - minV);
	                const innerW = width - pad * 2;
	                const innerH = height - pad * 2;
	                return safe
	                    .map((v, idx) => {
	                        const x = pad + (innerW * idx) / (safe.length - 1);
	                        const norm = (v - minV) / range;
	                        const y = pad + innerH - norm * innerH;
	                        return `${x.toFixed(1)},${y.toFixed(1)}`;
	                    })
	                    .join(' ');
	            };

	            const dailyBinarySeries = lastNDays.map((d) => (completionMap[d] ? 1 : 0));
	            const sparkPoints = buildSparklinePoints(dailyBinarySeries);

	            const perAreaStats = activeAreas.map((areaKey) => {
	                const area = lifeAreas[areaKey];
	                const dailyHistory = area && area.goals && area.goals.dailyHistory ? area.goals.dailyHistory : {};
	                const completed = new Set();
	                Object.keys(dailyHistory).forEach((date) => {
	                    const entry = dailyHistory[date];
	                    if (entry && entry.completed) completed.add(date);
	                });

	                // Current streak (all-time), ending today
	                let current = 0;
	                for (let i = 0; i < 3650; i++) {
	                    const d = new Date();
	                    d.setDate(d.getDate() - i);
	                    const ds = getLocalDateString(d);
	                    if (completed.has(ds)) current++;
	                    else break;
	                }

	                // Best streak (all-time)
	                const dates = Array.from(completed).sort();
	                let best = 0;
	                let run = 0;
	                let prev = null;
	                dates.forEach((ds) => {
	                    if (!prev) {
	                        run = 1;
	                        best = Math.max(best, run);
	                        prev = ds;
	                        return;
	                    }
	                    const prevDate = parseLocalDate(prev);
	                    prevDate.setDate(prevDate.getDate() + 1);
	                    const expected = getLocalDateString(prevDate);
	                    if (ds === expected) run += 1;
	                    else run = 1;
	                    best = Math.max(best, run);
	                    prev = ds;
	                });

	                const rangeCompleted = lastNDays.filter((d) => completed.has(d)).length;
	                const rangeRate = Math.round((rangeCompleted / rangeDays) * 100);

	                return { areaKey, current, best, rangeCompleted, rangeRate };
	            });

	            return (
	                <div className="space-y-8 fade-in text-white">
	                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-green-500/20 to-emerald-600/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">📈</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Progress & Statistics</h2>
                        <p className="text-slate-400 text-lg">
                            Track your consistency and celebrate your wins
                        </p>
                    </div>

	                    <div className="glass rounded-2xl p-6 border border-slate-700/50">
	                        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
	                            <div className="flex flex-col gap-2">
	                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Life Area</label>
                                <select
                                    value={selectedAreaScope}
                                    onChange={(e) => setSelectedAreaScope(e.target.value)}
                                    className="px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all"
                                >
                                    <option value="all">All Active Areas</option>
                                    {activeAreas.map((areaKey) => (
                                        <option key={areaKey} value={areaKey}>
                                            {LIFE_AREAS[areaKey]?.icon || ''} {LIFE_AREAS[areaKey]?.name || areaKey}
                                        </option>
                                    ))}
                                </select>
	                            </div>

	                            <div className="flex flex-col gap-2">
	                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Date Range</label>
	                                <div className="flex items-center gap-2">
                                    {[7, 30, 90].map((d) => (
                                        <button
                                            key={d}
                                            type="button"
                                            onClick={() => setRangeDays(d)}
                                            className={`px-4 py-2 rounded-xl border text-sm font-bold transition-all ${
                                                rangeDays === d
                                                    ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-200 shadow-[0_0_10px_rgba(16,185,129,0.15)]'
                                                    : 'bg-slate-800/40 border-slate-700 text-slate-300 hover:bg-slate-800 hover:border-slate-600'
                                            }`}
                                        >

	                                                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
	                                                >
	                                                    Clear
	                                                </button>
	                                            </div>
	                                            <div className="text-xs text-slate-500">
	                                                Notes are stored in your data and will sync in cloud mode.
	                                            </div>
	                                        </div>
	                                    </div>
	                                </div>
	                            </div>
	                        </div>
	                    )}

	                    <div className="glass rounded-2xl p-8 border border-slate-700/50 min-h-[400px]">
	                        <h3 className="text-xl font-bold text-white mb-6">Recent Completions</h3>
	                        {((viewMode === 'month') ? monthCompletions : filteredCompletions).length === 0 ? (
	                            <div className="flex flex-col items-center justify-center h-64 text-slate-500 border-2 border-dashed border-slate-700/50 rounded-xl">
	                                <span className="text-4xl mb-3 opacity-50">🏆</span>
	                                <p className="text-center">No completions in this range.</p>
	                                <p className="text-sm opacity-60">Try expanding the date range or switching to All Active Areas.</p>
	                            </div>
	                        ) : (
	                            <div className="space-y-4">
	                                {((viewMode === 'month') ? monthCompletions : filteredCompletions)
	                                    .slice()
	                                    .sort((a, b) => new Date(b.date) - new Date(a.date))
	                                    .slice(0, 10)
	                                    .map((completion, index) => {
                                        const areaInfo = LIFE_AREAS[completion.lifeArea];
                                        const [y, m, d] = completion.date.split('-').map(Number);
                                        const dateObj = new Date(y, m - 1, d);
                                        return (
                                            <div
                                                key={index}
                                                className="flex items-center space-x-4 p-4 rounded-xl border border-slate-700/50 bg-slate-800/30 hover:bg-slate-800/50 transition-all hover:scale-[1.01] group"
                                            >
                                                <div className="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500 border border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.1)] group-hover:shadow-[0_0_15px_rgba(16,185,129,0.2)] transition-all">
                                                    ✓
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-lg filter drop-shadow">{areaInfo.icon}</span>
                                                        <span className={`text-xs px-2 py-0.5 rounded-full border border-slate-700 bg-${areaInfo.color}-500/10 text-${areaInfo.color}-300 font-mono uppercase tracking-wide`}>
                                                            {areaInfo.name}
                                                        </span>
                                                    </div>
                                                    <p className="font-medium text-white group-hover:text-indigo-200 transition-colors">{completion.goal}</p>
                                                    <p className="text-xs text-slate-500 mt-1">
                                                        {dateObj.toLocaleDateString('en-US', {
                                                            weekday: 'long',
                                                            year: 'numeric',
                                                            month: 'long',
                                                            day: 'numeric'
                                                        })}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // SETTINGS
        // ==========================================
        function Settings({
            exportData,
            importData,
            user,
            loadDemoData,
            clearAllData,
            storageInfo,
            archiveOldHistory,
            isOnline,
            lastLocalSaveAt,
            lastCloudSyncAt,
            syncEvents,
            clearSyncEvents
        }) {
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (file) {
                    importData(file);
                    e.target.value = '';
                }
            };

	            const [archiveMonths, setArchiveMonths] = React.useState(6);
	
            return (
                <div className="space-y-8 fade-in text-white">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-slate-600/20 to-slate-500/20 border border-white/10 mb-4 backdrop-blur-sm">
                            <span className="text-5xl drop-shadow-lg filter">⚙️</span>
                        </div>
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight">Settings</h2>
                        <p className="text-slate-400 text-lg">
                            Manage your data and preferences
                        </p>
                    </div>

                    {user && (
                        <div className="glass rounded-2xl p-6 border border-emerald-500/30 bg-emerald-500/5">
                            <h3 className="font-bold text-emerald-300 mb-2 flex items-center">
                                <span className="mr-2">✓</span> Cloud Sync Enabled
                            </h3>
                            <p className="text-emerald-100/80 text-sm mb-2">
                                Your data is automatically syncing across all your devices in real-time.
                            </p>
                            <p className="text-emerald-400 text-xs font-mono bg-emerald-900/30 inline-block px-2 py-1 rounded">
                                Logged in as: {user.email}
                            </p>
	                            <div className="mt-3 flex flex-wrap items-center gap-2 text-xs">
	                                <span className={`px-2 py-1 rounded-full border font-mono ${
	                                    isOnline ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-rose-500/10 border-rose-500/30 text-rose-200'
	                                }`}>
	                                    {isOnline ? 'Online' : 'Offline'}
	                                </span>
	                                <span className="px-2 py-1 rounded-full border border-slate-700 bg-slate-900/20 text-slate-300 font-mono">
	                                    Last save: {lastLocalSaveAt || '—'}
	                                </span>
	                                <span className="px-2 py-1 rounded-full border border-slate-700 bg-slate-900/20 text-slate-300 font-mono">
	                                    Last sync: {lastCloudSyncAt || '—'}
	                                </span>
	                            </div>
	
	                            <details className="mt-4">
	                                <summary className="cursor-pointer text-sm text-emerald-200/80 hover:text-emerald-200 font-bold">
	                                    Sync diagnostics
	                                </summary>
	                                <div className="mt-3 rounded-xl border border-emerald-500/20 bg-emerald-900/10 p-4">
	                                    <div className="flex items-center justify-between gap-3 flex-wrap">
	                                        <div className="text-xs text-emerald-100/70">
	                                            Recent events (newest first)
	                                        </div>
	                                        <div className="flex items-center gap-2">
	                                            <button
	                                                type="button"
	                                                onClick={() => {
	                                                    const text = JSON.stringify(syncEvents || [], null, 2);
	                                                    if (navigator.clipboard && navigator.clipboard.writeText) {
	                                                        navigator.clipboard.writeText(text);
	                                                        return;
	                                                    }
	                                                    window.prompt('Copy sync log:', text);
	                                                }}
	                                                className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold"
	                                            >
	                                                Copy log
	                                            </button>
	                                            <button
	                                                type="button"
	                                                onClick={() => typeof clearSyncEvents === 'function' && clearSyncEvents()}
	                                                className="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-200 text-xs font-bold"
	                                            >
	                                                Clear log
	                                            </button>
	                                        </div>
	                                    </div>
	                                    <div className="mt-3 max-h-48 overflow-auto rounded-lg bg-slate-950/40 border border-slate-800 p-3 text-xs font-mono text-emerald-100/80">
	                                        {(Array.isArray(syncEvents) && syncEvents.length > 0) ? (
	                                            syncEvents.map((e, idx) => (
	                                                <div key={`se:${idx}`} className="py-1 border-b border-slate-800/60 last:border-b-0">
	                                                    <span className="text-emerald-200">{e.ts}</span>{' '}
	                                                    <span className="text-emerald-300 font-bold">{e.type}</span>
	                                                    {e.detail ? <span className="text-slate-300"> — {e.detail}</span> : null}
	                                                </div>
	                                            ))
	                                        ) : (
	                                            <div className="text-slate-400">No events yet.</div>
	                                        )}
	                                    </div>
	                                </div>
	                            </details>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="glass rounded-2xl p-8 border border-slate-700/50 hover:border-blue-500/30 transition-colors group">
                            <div className="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center text-2xl mb-4 text-blue-400 group-hover:scale-110 transition-transform">
                                📤
                            </div>
                            <h3 className="text-xl font-bold text-white mb-2">Export Data</h3>
                            <p className="text-slate-400 text-sm mb-6 min-h-[40px]">
                                Download a backup of all your goals, time blocks, and progress data.
                            </p>
                            <button
                                onClick={exportData}
                                className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2"
                            >
                                <span>Download Backup</span>
                            </button>
                        </div>

                        <div className="glass rounded-2xl p-8 border border-slate-700/50 hover:border-purple-500/30 transition-colors group">
                            <div className="w-12 h-12 rounded-xl bg-purple-500/20 flex items-center justify-center text-2xl mb-4 text-purple-400 group-hover:scale-110 transition-transform">
                                📥
                            </div>
                            <h3 className="text-xl font-bold text-white mb-2">Import Data</h3>
                            <p className="text-slate-400 text-sm mb-6 min-h-[40px]">
                                Restore your data from a previously exported backup file.
                            </p>
                            <div className="relative">
                                <input
                                    type="file"
                                    accept=".json"
                                    onChange={handleImport}
                                    className="block w-full text-sm text-slate-400
                                        file:mr-4 file:py-3 file:px-6
                                        file:rounded-xl file:border-0
                                        file:text-sm file:font-bold
                                        file:bg-purple-600 file:text-white
                                        hover:file:bg-purple-500
                                        cursor-pointer file:cursor-pointer file:transition-colors file:shadow-lg file:shadow-purple-500/30"
                                />
                            </div>
                        </div>
                    </div>

	                    <div className="glass rounded-2xl p-8 border border-slate-700/50">
	                        <div className="flex items-center justify-between gap-4 flex-wrap">
	                            <div className="text-left">
	                                <h3 className="text-xl font-bold text-white">Storage & Cleanup</h3>
	                                <p className="text-slate-400 text-sm mt-2 max-w-2xl">
	                                    Monitor your local storage usage and optionally archive older history to keep the app snappy.
	                                </p>
	                            </div>
	                        </div>

	                        <div className="mt-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
	                            <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
	                                <div className="flex items-center justify-between">
	                                    <div className="text-sm font-bold text-slate-200">Local storage usage</div>
	                                    <div className={`text-xs font-mono ${storageInfo && storageInfo.warn ? 'text-rose-300' : 'text-slate-400'}`}>
	                                        {storageInfo ? `${storageInfo.fmt(storageInfo.localTotalBytes)} (~${storageInfo.pct}% of 5MB)` : '—'}
	                                    </div>
	                                </div>
	                                <div className="mt-3 h-2 rounded-full bg-slate-800 overflow-hidden border border-slate-700/60">
	                                    <div
	                                        className={`h-full ${storageInfo && storageInfo.warn ? 'bg-rose-500/60' : 'bg-emerald-500/60'}`}
	                                        style={{ width: `${storageInfo ? storageInfo.pct : 0}%` }}
	                                    />
	                                </div>
	                                {storageInfo && storageInfo.warn && (
	                                    <div className="mt-3 text-xs text-rose-200">
	                                        Approaching typical browser limits. Consider exporting and archiving older history.
	                                    </div>
	                                )}
	                                {storageInfo && (
	                                    <div className="mt-4 text-xs text-slate-500 font-mono space-y-1">
	                                        <div>oneThingApp: {storageInfo.fmt(storageInfo.localBytesByKey.oneThingApp || 0)}</div>
	                                        <div>clientId: {storageInfo.fmt(storageInfo.localBytesByKey.oneThingClientId || 0)}</div>
	                                        <div>prefs: {storageInfo.fmt((storageInfo.localBytesByKey.oneThingAutosaveDaily || 0) + (storageInfo.localBytesByKey.oneThingDismissedReviewReminders || 0))}</div>
	                                    </div>
	                                )}
	                            </div>

	                            <div className="rounded-2xl border border-slate-700/60 bg-slate-900/20 p-6">
	                                <div className="text-sm font-bold text-slate-200">Archive older history</div>
	                                <div className="text-xs text-slate-500 mt-2">
	                                    Archives daily history, day notes, and time blocks older than the chosen cutoff. Reviews are kept.
	                                </div>
	                                <div className="mt-4 flex items-center gap-3 flex-wrap">
	                                    <select
	                                        value={archiveMonths}
	                                        onChange={(e) => setArchiveMonths(Number(e.target.value))}
	                                        className="px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition-all"
	                                    >
	                                        {[3, 6, 12, 24].map((m) => (
	                                            <option key={m} value={m}>{m} months</option>
	                                        ))}
	                                    </select>
	                                    <button
	                                        type="button"
	                                        onClick={() => typeof archiveOldHistory === 'function' && archiveOldHistory(archiveMonths)}
	                                        className="px-5 py-2.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/15 text-emerald-200 border border-emerald-500/30 font-bold transition-all"
	                                    >
	                                        Archive
	                                    </button>
	                                </div>
	                            </div>
	                        </div>
	                    </div>
		
                    <div className="glass rounded-2xl p-8 border border-slate-700/50">
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                            <div className="text-left">
	                                <h3 className="text-xl font-bold text-white">Demo / Reset</h3>
	                                <p className="text-slate-400 text-sm mt-2 max-w-2xl">
	                                    Load realistic demo data to quickly test flows, or clear all data to start fresh.
	                                </p>
	                                {user && (
	                                    <p className="text-yellow-300/80 text-xs mt-2 font-mono">
	                                        Cloud sync is enabled — these actions can overwrite your cloud data.
	                                    </p>
	                                )}
	                            </div>
	                            <div className="flex gap-3">
	                                <button
	                                    onClick={loadDemoData}
	                                    className="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 hover:border-slate-600 font-bold transition-all"
	                                >
	                                    Load Demo Data
	                                </button>
	                                <button
	                                    onClick={clearAllData}
	                                    className="px-5 py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-200 border border-red-500/30 hover:border-red-500/50 font-bold transition-all"
	                                >
	                                    Clear All Data
	                                </button>
	                            </div>
	                        </div>
	                    </div>

                    <div className="glass rounded-2xl p-8 border border-slate-700/50 text-center">
                        <h3 className="text-xl font-bold text-white mb-4">About</h3>
                        <p className="text-slate-400 mb-6 max-w-2xl mx-auto leading-relaxed">
                            This app is based on "The ONE Thing" by Gary Keller and Jay Papasan.
                            It helps you identify and focus on the single most important task that
                            will make everything else easier or unnecessary.
                        </p>
                        <p className="text-xs text-slate-600 font-mono">
                            {user ?
                                'Your data is securely stored in the cloud and synced across all your devices.' :
                                'All data is stored locally in your browser. No information is sent to any server.'
                            }
                        </p>
                        <div className="mt-4 flex items-center justify-center gap-2 text-xs text-slate-500 font-mono">
                            <span className="px-2 py-1 rounded-lg border border-slate-700 bg-slate-900/30">
                                {APP_VERSION}
                            </span>
                            <span className="px-2 py-1 rounded-lg border border-slate-700 bg-slate-900/30">
                                {APP_BUILD_DATE}
                            </span>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
                console.error("Uncaught error:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white p-8">
                            <div className="max-w-3xl mx-auto glass rounded-2xl p-8 border border-red-500/50">
                                <h1 className="text-2xl font-bold text-red-400 mb-4">Something went wrong.</h1>
                                <p className="text-slate-300 mb-4">Please report this error:</p>
                                <pre className="bg-slate-950 p-4 rounded-xl overflow-auto text-xs font-mono text-red-200 mb-4">
                                    {this.state.error && this.state.error.toString()}
                                </pre>
                                <pre className="bg-slate-950 p-4 rounded-xl overflow-auto text-xs font-mono text-slate-500">
                                    {this.state.errorInfo && this.state.errorInfo.componentStack}
                                </pre>
                                <button 
                                    onClick={() => window.location.reload()}
                                    className="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all"
                                >
                                    Reload Page
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children; 
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
